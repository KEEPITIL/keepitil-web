name: node tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test assets/js/*.test.mjs
      # Kai Tarako drop-in (games/kai/): the root worker never caches or answers an app folder, and a cache-name bump
      # evicts only old kil-* caches. Same step as keepitil-web#191 (W-3); guarded by assets/js/ci-sw-test.test.mjs.
      - run: node --test tests/sw-cache-isolation.test.cjs
