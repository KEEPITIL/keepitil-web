<!--
  TUITEA invite page (owner decision 2026-11-21 22:22 PST: the SMS invite is a "branded card link").
  The SMS links here so that iMessage, WhatsApp and other apps show the TUITEA invite card as the
  link preview (og:image below). Then:
    - Apple devices (iPhone, iPad, iPod, Mac, and iPadOS reporting itself as "Macintosh" with touch)
      go straight to the App Store listing.
    - Everyone else goes to the TUITEA web app at /app/tuitea/app/.
  Link-preview crawlers do not run JavaScript, so they stay on this page and read the og tags.
  Three plain TUITEA-styled buttons (owner, 2026-11-21 ~23:15 PST) stay visible as the fallback if the
  redirect does not fire: "Download Apple App", "Download Android App" (coming soon; disabled, not a
  link) and "Download Web App". No official Apple or Google store artwork.
  Add ?stay=1 to the URL to see the page without being forwarded (QA and screenshots).
  Owned by the site, not by the TUITEA pipeline. Self-contained: no external scripts, fonts or trackers.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'sha256-3K+6uJ2rWiRtHLs7EfqafYO8NUVrla7fWijKrckPSsw='; base-uri 'none'; form-action 'none'">

<script id="invite-redirect">
(function (nav, loc) {
  var APP_STORE = 'https://apps.apple.com/app/id6806472413';
  var WEB_APP = '/app/tuitea/app/';
  if (/[?&]stay\b/.test(loc.search || '')) return;
  var ua = String((nav && nav.userAgent) || '');
  var touch = Number((nav && nav.maxTouchPoints) || 0);
  // Windows Phone once claimed "like iPhone OS"; it is not an Apple device.
  var apple = !/Windows Phone/i.test(ua) && (
    /\b(iPhone|iPad|iPod)\b/.test(ua) ||
    (/\bMacintosh\b/.test(ua) && touch > 1) || // iPadOS 13+ asking for the desktop site
    /\bMacintosh\b/.test(ua)                   // Mac
  );
  loc.replace(apple ? APP_STORE : WEB_APP);
})(navigator, location);
</script>

<style>
  :root{--ink:#F4EBD6;--muted:#D9CDB1;--gold:#E3C27A;--night:#14170F;--glass:rgba(16,19,12,.62);--line:rgba(227,194,122,.45)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
       color:var(--ink);background:var(--night);
       font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background-color:var(--night);
       background-image:linear-gradient(180deg,rgba(12,14,9,.35),rgba(12,14,9,.7)),url("/app/tuitea/app/assets/assets/brand/backgrounds/home_mobile.webp");
       background-size:cover;background-position:center;background-repeat:no-repeat}
  @media (min-width:768px){
    body::before{background-image:linear-gradient(180deg,rgba(12,14,9,.3),rgba(12,14,9,.65)),url("/app/tuitea/app/assets/assets/brand/backgrounds/home_desktop.webp")}
  }
  main{width:100%;max-width:26rem;text-align:center;padding:2rem 1.5rem;border-radius:24px;
       background:var(--glass);border:1px solid var(--line);
       -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .icon{width:128px;height:128px;border-radius:28px;display:block;margin:0 auto 1.25rem;
        box-shadow:0 0 0 2px var(--line),0 12px 32px rgba(0,0,0,.5)}
  .kicker{margin:0;font:500 .9rem/1.3 "Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  h1{margin:.35rem 0 .9rem;font:600 2.6rem/1.1 "Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;letter-spacing:.08em;color:var(--gold)}
  p.lead{margin:0 0 1.6rem;color:var(--muted)}
  .actions{display:flex;flex-direction:column;gap:.75rem}
  .btn{display:flex;align-items:center;justify-content:center;min-height:52px;width:100%;padding:.8rem 1.2rem;
       border-radius:14px;text-decoration:none;font-weight:650;font-size:1.05rem;letter-spacing:.01em}
  .btn.primary{background:linear-gradient(180deg,#EBCD8A,#C9A24E);color:#1A1D13;border:1px solid #F1DBA4;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .btn.secondary{background:rgba(20,23,15,.55);color:var(--gold);border:1px solid var(--line)}
  .btn.disabled{background:rgba(255,255,255,.06);color:rgba(217,205,177,.6);border:1px dashed rgba(217,205,177,.35);
       font-weight:500;cursor:not-allowed;user-select:none;flex-direction:column;gap:.1rem;line-height:1.2}
  .btn.disabled small{font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .note{margin:1.4rem 0 0;font-size:.8rem;color:var(--muted);opacity:.85}
</style>

<main>

  <div class="actions">
    <a class="btn primary" href="https://apps.apple.com/app/id6806472413">Download Apple App</a>
