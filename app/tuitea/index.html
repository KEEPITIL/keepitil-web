<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUITEA</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="canonical" href="https://keepitil.com/app/tuitea/app/">
<!--
  owner: no redirects — EXCEPTION, needs Joe's explicit decision.

  TUITEA 1.0 build 88, phase 2 (owner: no redirects) made this address a real
  page. Nothing here was allowed to move the visitor on its own. This file
  breaks that rule: /app/tuitea/ now redirects to /app/tuitea/app/, which is
  inside the installed PWA scope (/app/tuitea/). /apps/tuitea/ is retired and
  is not the target. Do not treat this exception as accepted until Joe says so.

  The manifest id stays /app/tuitea/, so this path must keep existing. A valid
  ?invite= (32 hex characters) is forwarded. Known auth keys (token_hash, type,
  code, error, error_code, error_description) pass through. utm_* is forwarded
  only when its value cannot be a redirect. Every other query key is dropped.
  The hash passes through as-is. The target path is fixed.
-->
<meta http-equiv="refresh" content="0; url=/app/tuitea/app/">
<script>
function tuiteaRedirectTarget(search, hash) {
  var PATH = "/app/tuitea/app/";
  var ALLOW = { token_hash: 1, type: 1, code: 1, error: 1, error_code: 1, error_description: 1 };
  if (typeof search !== "string" || search.charAt(0) !== "?") search = "";
  if (typeof hash !== "string" || hash.charAt(0) !== "#") hash = "";
  var parts = search.length > 1 ? search.slice(1).split("&") : [];
  var kept = [];
  var inviteKept = false;
  var i, part, eq, key, val, decoded;
  for (i = 0; i < parts.length; i++) {
    part = parts[i];
    if (!part) continue;
    eq = part.indexOf("=");
    key = eq === -1 ? part : part.slice(0, eq);
    val = eq === -1 ? "" : part.slice(eq + 1);
    if (key === "invite") {
      if (!inviteKept) {
        try { decoded = decodeURIComponent(val.replace(/\+/g, " ")); }
        catch (e) { decoded = ""; }
        decoded = String(decoded).toLowerCase();
        if (/^[0-9a-f]{32}$/.test(decoded)) {
          kept.push("invite=" + decoded);
          inviteKept = true;
        }
      }
      continue;
    }
    if (ALLOW[key]) {
      kept.push(part);
      continue;
    }
    if (/^utm_[A-Za-z0-9_]+$/.test(key)) {
      try { decoded = decodeURIComponent(val.replace(/\+/g, " ")); }
      catch (e) { continue; }
      if (decoded && decoded.length <= 200 && !/[\/\\:@?#%]/.test(decoded)) kept.push(part);
    }
  }
  var dest = PATH;
  if (kept.length) dest += "?" + kept.join("&");
  if (hash) dest += hash;
  if (dest.slice(0, PATH.length) !== PATH) return PATH;
  var after = dest.charAt(PATH.length);
  if (after && after !== "?" && after !== "#") return PATH;
  return dest;
}
/* end tuiteaRedirectTarget */
(function () {
  var dest = tuiteaRedirectTarget(location.search, location.hash);
  document.addEventListener("DOMContentLoaded", function () {
    var link = document.getElementById("tuitea-continue");
    if (link) link.setAttribute("href", dest);
  });
  location.replace(dest);
})();
</script>
</head>
<body>
<p><a id="tuitea-continue" href="/app/tuitea/app/">Continue to TUITEA</a></p>
</body>
</html>
