# Tests for the KMOB publisher (scripts/kmob-publish), no network and no secret: every refusal against fixtures, an end-to-end dry
# run into a local bare repo, then the negative controls (each check switched off in turn must make the suite FAIL), and a check
# that every action in the kmob-publish workflows is pinned to a full commit SHA. Docs: docs/KMOB_PUBLISH.md.
name: kmob-publish-check

on:
  pull_request:
    paths:
      - 'scripts/kmob-publish/**'
      - '.github/workflows/kmob-publish.yml'
      - '.github/workflows/kmob-publish-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/kmob-publish/**'
      - '.github/workflows/kmob-publish.yml'
      - '.github/workflows/kmob-publish-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmob-publish-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: fixtures and end-to-end dry run
        run: node --test scripts/kmob-publish/kmob-publish.test.mjs
      - name: negative controls (each check off -> the suite must fail)
        run: |
          rc=0
          for rule in tip provenance checks pr-checks precondition rollback artifact artifact-integrity path-guard environment; do
            if KMOB_VERIFY_DISABLE=$rule node --test scripts/kmob-publish/kmob-publish.test.mjs > "$RUNNER_TEMP/nc-$rule.log" 2>&1; then
              echo "::error::negative control: with '$rule' switched off the suite still passes"; rc=1
            else
              echo "ok   with '$rule' off the suite fails: $(grep -E '^# fail' "$RUNNER_TEMP/nc-$rule.log")"
            fi
          done
          exit $rc
      - name: every action is pinned to a commit SHA
        run: |
          bad=$(grep -hE '^\s*-?\s*uses:' .github/workflows/kmob-publish.yml .github/workflows/kmob-publish-check.yml | grep -vE 'uses:\s*[^@]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then echo "::error::unpinned action(s):"; echo "$bad"; exit 1; fi
          echo "ok   all actions SHA-pinned"
      - name: the publish workflow is main-only, environment-gated and starts in dry-run
        run: |
          f=.github/workflows/kmob-publish.yml
          grep -q "if: github.ref == 'refs/heads/main' && github.repository == 'KEEPITIL/keepitil-web'" $f
          grep -qE '^    environment: kmob-publish$' $f
          grep -qE '^        default: dry-run$' $f
          grep -qE '^permissions: \{\}
          if grep -qE '^\s+(push|pull_request|pull_request_target|schedule|workflow_run|repository_dispatch):' $f; then echo "::error::$f must only be started by hand"; exit 1; fi
          echo "ok   workflow_dispatch only, main only, environment kmob-publish, dry-run default, no top-level permissions"
 $f
          e=$(grep -n 'cli.mjs env-check' $f | head -1 | cut -d: -f1); v=$(grep -n 'cli.mjs verify' $f | head -1 | cut -d: -f1)
          if [ -z "$e" ] || [ -z "$v" ] || [ "$e" -gt "$v" ]; then echo "::error::the environment check must run before verify"; exit 1; fi
          if grep -qE '^\s+(push|pull_request|pull_request_target|schedule|workflow_run|repository_dispatch):' $f; then echo "::error::$f must only be started by hand"; exit 1; fi
          echo "ok   workflow_dispatch only, main only, environment kmob-publish, dry-run default, no top-level permissions"
