<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUITEA</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#3F7658">
<link rel="icon" href="/app/tuitea/icon-192.png">
<link rel="apple-touch-icon" href="/app/tuitea/apple-touch-icon.png">
<link rel="manifest" href="/app/tuitea/manifest.webmanifest">
<!--
  A REAL PAGE, NOT A REDIRECT (TUITEA 1.0 build 88, phase 2; owner: no redirects).

  This address used to bounce every visitor to keepitil.com/support. It now says what TUITEA
  is and gives direct links: the web app itself (/app/tuitea/app/) and support. Nothing
  moves the visitor on its own.

  Two jobs other live code depends on are kept, without redirecting:
    1. The manifest id is /app/tuitea/, so this path must exist; do not delete it. Installs
       made before start_url became /app/tuitea/app/ still open here; they get the same
       "Open TUITEA" button.
    2. An invitation (?invite=<token>) is carried on the Open TUITEA link, so the web app
       receives it (InviteLinks.tokenFrom reads ?invite=).
-->
<style>
  :root{--bg:#FBF7EF;--ink:#20261F;--muted:#6E7566;--accent:#3F7658;--line:#E2D9C6;--surface:#FFFDF8}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14170F;--ink:#ECE7DA;--muted:#9BA391;--accent:#6FBF8F;--line:#333A2D;--surface:#1C201A}}
  :root[data-theme="dark"]{--bg:#14170F;--ink:#ECE7DA;--muted:#9BA391;--accent:#6FBF8F;--line:#333A2D;--surface:#1C201A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
  main{width:100%;max-width:30rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.6rem 1.4rem;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.5rem;margin:.6rem 0 .3rem}
  p{color:var(--muted);margin:0 0 1rem}
  a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:.85rem 1.2rem;border-radius:999px;margin:.5rem 0}
  a.link{color:var(--accent);font-weight:600}
  .small{font-size:.88rem}
</style>
</head>
<body>
<main>
  <img src="/app/tuitea/icon-192.png" alt="">
  <h1>TUITEA</h1>
  <p>A private home for your family — people, stories, health and the everyday running of a household.</p>
  <a class="btn" id="open" href="/app/tuitea/app/">Open TUITEA</a>
  <p class="small" id="invited" hidden>Your invitation goes with you — sign in or create an account, and TUITEA will ask to join the family that invited you.</p>
  <p class="small">Questions? <a class="link" href="https://keepitil.com/support/?product=tuitea">TUITEA support</a></p>
</main>
<script>
  // The invitation travels on the link (never stored, never sent anywhere else).
  (function () {
    try {
      var t = (new URLSearchParams(location.search).get('invite') || '').toLowerCase();
      if (/^[0-9a-f]{32}$/.test(t)) {
        document.getElementById('open').href = '/app/tuitea/app/?invite=' + t;
        document.getElementById('invited').hidden = false;
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
