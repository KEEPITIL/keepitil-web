<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0620">
<title>KBeats (prototype) - KEEPITIL</title>
<style>
:root{--bg:#0b0620;--ink:#f3eeff;--mute:#a79bd0;--panel:#1a1238;--accent:#e540ff;--c0:#22d3ee;--c1:#e540ff;--c2:#facc15;--c3:#22e07a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b0620d9;z-index:3}
.card{background:var(--panel);border-radius:18px;padding:22px;width:100%;max-width:380px;text-align:center;box-shadow:0 0 40px #e540ff33}
h1{margin:0 0 4px;font-size:2.2rem;letter-spacing:.04em}
.sub{color:var(--mute);margin:0 0 14px}
.row{display:flex;gap:8px;margin:10px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;background:#2a1d57;font-weight:700;flex:1}
button.sel{background:var(--accent);color:#16002a}
button.go.alt{background:#2a1d57;color:var(--ink)}
button.go{display:block;width:100%;background:linear-gradient(90deg,var(--c0),var(--c1));color:#10002a;font-size:1.1rem;margin-top:10px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
label{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--mute);font-size:.9rem;margin:6px 0}
.off{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:.9rem}
.off button{flex:0 0 44px;padding:8px}
.keys{color:var(--mute);font-size:.8rem;margin:10px 0 0}
.res{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;text-align:left;margin:10px 0;font-variant-numeric:tabular-nums}
.res b{text-align:right}
.grade{font-size:3.4rem;font-weight:900;color:var(--accent)}
.stars{letter-spacing:.2em;color:var(--c2)}
</style>
</head>
<body>
<canvas id="c" aria-label="KBeats play field. Keys D F J K, or tap the four lanes."></canvas>
<div id="menu" class="overlay">
  <div class="card">
    <h1>KBeats</h1>
    <p class="sub">4-lane rhythm. Built-in demo track (synthesised, no downloads).</p>
    <div class="row" role="group" aria-label="Difficulty">
      <button data-d="easy">Easy</button><button data-d="normal" class="sel">Normal</button><button data-d="expert">Expert</button>
    </div>
    <label><input type="checkbox" id="practice"> Practice (cannot fail)</label>
    <div class="off">Audio offset <button id="offM" aria-label="Earlier">-</button><b id="offV">0 ms</b><button id="offP" aria-label="Later">+</button></div>
    <button class="go" id="start">Start</button>
    <p class="keys">Keys: D F J K (or arrow keys) &middot; Touch: tap a lane, hold, flick for arrows &middot; Esc pauses</p>
    <p class="keys">Prototype. Scores stay on this device. No network, no tracking.</p>
  </div>
</div>
<div id="pause" class="overlay hidden"><div class="card"><h1>Paused</h1><button class="go" id="resume">Resume</button><button class="go alt" id="quit">Quit</button></div></div>
<div id="result" class="overlay hidden"><div class="card" id="resBody"></div></div>

<script>
//LOGIC-BEGIN
// ---- verbatim from games/kbeats/js/config.js (CONFIG only) ----
const CONFIG = {
  windows: { perfect: 45, great: 90, good: 135, miss: 180 },
  accuracyWeight: { perfect: 1, great: 0.75, good: 0.5, miss: 0 },
  points: { perfect: 300, great: 200, good: 100, miss: 0 },
  /* combo → multiplier; first tier whose `at` the combo has reached (highest wins) */
  comboTiers: [{ at: 0, x: 1 }, { at: 10, x: 2 }, { at: 25, x: 4 }, { at: 50, x: 8 }],
  hype: { perfect: 0.035, great: 0.02, good: 0, miss: -0.06, durationSec: 8, multiplier: 2 },
  health: { start: 0.6, perfect: 0.015, great: 0.01, good: 0.004, miss: -0.07 },
  grades: [['S+', 0.98], ['S', 0.95], ['A', 0.9], ['B', 0.8], ['C', 0.7], ['D', 0]],
  stars: [0.6, 0.75, 0.85, 0.92, 0.97],      // accuracy for 1..5 stars on a cleared track
  holdReleaseGraceMs: 120,                   // a hold released this close to its tail still completes
  expireLagMs: 60,                           // live frame loop expires notes this late (see judge.js)
  swipeMinPx: 34,
  leadSec: { easy: 1.9, normal: 1.6, expert: 1.3 },
  chordWindowMs: 8,
  minLaneGapMs: { easy: 340, normal: 150, expert: 85 },
  maxNps: { easy: 3.2, normal: 6.5, expert: 12 },
  maxRepeatSameLane: 8,
  gridToleranceMs: 6,
};
// ---- verbatim from games/kbeats/js/judge.js (imports/exports stripped) ----
/* KBeats judgement + scoring engine. Pure: no DOM, no clock of its own. Every call carries the
   song time (seconds, already on the audio clock and offset-corrected) so the same code runs live
   in the browser and in Node to re-simulate a submitted input log (anti-cheat, tests).

   Note shape: { t, lane 0..3, type: 'tap'|'hold'|'swipe', dur (s, holds), dir (swipes) }
   A chord is simply two notes sharing t on different lanes. */

function classify(deltaMs, w = CONFIG.windows) {
  const a = Math.abs(deltaMs);
  if (a <= w.perfect) return 'perfect';
  if (a <= w.great) return 'great';
  if (a <= w.good) return 'good';
  if (a <= w.miss) return 'miss';
  return null;
}

function multiplierFor(combo, tiers = CONFIG.comboTiers) {
  let x = 1;
  for (const t of tiers) if (combo >= t.at) x = t.x;
  return x;
}

function gradeFor(acc, failed, cfg = CONFIG) {
  if (failed) return 'F';
  for (const [g, min] of cfg.grades) if (acc >= min) return g;
  return 'D';
}

class Judge {
  constructor(notes, opts = {}) {
    this.cfg = opts.config || CONFIG;
    this.practice = !!opts.practice;
    this.notes = notes.map((n, i) => ({ ...n, i, state: 0 }));    // 0 pending · 1 holding · 2 done
    this.byLane = [[], [], [], []];
    for (const n of this.notes) this.byLane[n.lane].push(n);
    for (const l of this.byLane) l.sort((a, b) => a.t - b.t);
    this.ptr = [0, 0, 0, 0];
    this.holding = [null, null, null, null];
    this.total = this.notes.length + this.notes.filter(n => n.type === 'hold').length;
    this.counts = { perfect: 0, great: 0, good: 0, miss: 0 };
    this.score = 0; this.combo = 0; this.maxCombo = 0; this.judged = 0; this.accSum = 0;
    this.hype = 0; this.hypeUntil = -1; this.hypeCount = 0;
    this.health = this.cfg.health.start; this.failed = false; this.failedAt = null;
    this.log = [];       // [t, lane, kind('p'|'r'|'s'), extra] — replayable input record
    this.deltas = [];    // [noteTime, hitTime − noteTime] for timing/drift analysis
    this.events = [];    // feedback for the renderer; drained by the client each frame
  }

  get accuracy() { return this.judged ? this.accSum / this.judged : 1; }
  get done() { return this.judged >= this.total; }
  hypeActive(t) { return t < this.hypeUntil; }

  _apply(j, t, lane, note, kind = 'head') {
    const c = this.cfg;
    this.counts[j]++; this.judged++; this.accSum += c.accuracyWeight[j];
    if (j === 'miss') this.combo = 0; else { this.combo++; if (this.combo > this.maxCombo) this.maxCombo = this.combo; }
    const hyped = this.hypeActive(t);
    this.score += Math.round(c.points[j] * multiplierFor(this.combo, c.comboTiers) * (hyped ? c.hype.multiplier : 1));
    if (!hyped) {
      this.hype = Math.max(0, Math.min(1, this.hype + c.hype[j]));
      if (this.hype >= 1) { this.hype = 0; this.hypeUntil = t + c.hype.durationSec; this.hypeCount++; this.events.push({ t, lane: -1, j: 'hype' }); }
    }
    this.health = Math.max(0, Math.min(1, this.health + c.health[j]));
    if (this.health <= 0 && !this.practice && !this.failed) { this.failed = true; this.failedAt = t; }
    this.events.push({ t, lane, j, kind, note: note ? note.i : -1 });
  }

  _pending(lane) {
    const arr = this.byLane[lane];
    let p = this.ptr[lane];
    while (p < arr.length && arr[p].state !== 0) p++;
    this.ptr[lane] = p;
    return arr[p] || null;
  }

  /* src 'key' | 'touch'. Touch must flick a swipe note (see swipe()); a key press accepts it. */
  press(lane, t, src = 'key') {
    this.update(t);
    this.log.push([t, lane, 'p', src]);
    const n = this._pending(lane);
    if (!n) return null;
    const j = classify((t - n.t) * 1000, this.cfg.windows);
    if (!j) return null;                      // nowhere near a note: ghost tap, no penalty
    if (n.type === 'swipe' && src === 'touch') return null;
    this.deltas.push([n.t, t - n.t]);
    if (n.type === 'hold' && j !== 'miss') { n.state = 1; this.holding[lane] = n; }
    else n.state = 2;
    this._apply(j, t, lane, n);
    if (n.type === 'hold' && j === 'miss') this._apply('miss', t, lane, n, 'tail');
    return j;
  }

  release(lane, t) {
    this.update(t);
    this.log.push([t, lane, 'r']);
    const n = this.holding[lane];
    if (!n) return null;
    this.holding[lane] = null; n.state = 2;
    const end = n.t + n.dur;
    const j = t >= end - this.cfg.holdReleaseGraceMs / 1000 ? 'perfect' : 'miss';
    this._apply(j, Math.min(t, end), lane, n, 'tail');
    return j;
  }

  /* t = when the finger went down, dir = flick direction. Wrong direction still lands, as GOOD. */
  swipe(lane, t, dir) {
    this.update(t);
    this.log.push([t, lane, 's', dir]);
    const n = this._pending(lane);
    if (!n || n.type !== 'swipe') return null;
    let j = classify((t - n.t) * 1000, this.cfg.windows);
    if (!j) return null;
    if (j !== 'miss' && n.dir && dir !== n.dir) j = 'good';
    n.state = 2;
    this._apply(j, t, lane, n);
    return j;
  }

  /* Expire notes whose window has fully passed and complete holds that reached their tail. */
  update(t) {
    const missS = this.cfg.windows.miss / 1000;
    for (let lane = 0; lane < 4; lane++) {
      const h = this.holding[lane];
      if (h && t >= h.t + h.dur) { this.holding[lane] = null; h.state = 2; this._apply('perfect', h.t + h.dur, lane, h, 'tail'); }
      for (;;) {
        const n = this._pending(lane);
        if (!n || n.t + missS >= t) break;
        n.state = 2;
        this._apply('miss', n.t + missS, lane, n);
        if (n.type === 'hold') this._apply('miss', n.t + missS, lane, n, 'tail');
      }
    }
  }

  result() {
    const acc = this.accuracy;
    const grade = gradeFor(acc, this.failed, this.cfg);
    const stars = this.failed ? 0 : this.cfg.stars.filter(s => acc >= s).length;
    return {
      score: this.score, accuracy: Math.round(acc * 1000) / 10, ...this.counts,
      maxCombo: this.maxCombo, grade, stars, failed: this.failed, practice: this.practice,
      fullCombo: this.counts.miss === 0 && this.judged === this.total, judgements: this.judged, total: this.total,
    };
  }
}

/* Deterministic re-simulation of a recorded input log. The server runs exactly this to decide
   whether a submitted ranked score is consistent with the chart it claims to have played. */
function simulate(notes, log, opts = {}) {
  const j = new Judge(notes, opts);
  for (const [t, lane, kind, extra] of log) {
    if (kind === 'p') j.press(lane, t, extra);
    else if (kind === 'r') j.release(lane, t);
    else if (kind === 's') j.swipe(lane, t, extra);
  }
  j.update(Infinity);
  return j.result();
}

function verifySubmission(notes, submission, opts = {}) {
  const r = simulate(notes, submission.log || [], opts);
  const reasons = [];
  if (r.score !== submission.score) reasons.push(`score ${submission.score} ≠ replay ${r.score}`);
  if (r.maxCombo !== submission.maxCombo) reasons.push('combo mismatch');
  const log = submission.log || [];
  for (let i = 1; i < log.length; i++) if (log[i][0] < log[i - 1][0] - 1e-6) { reasons.push('non-monotonic input log'); break; }
  return { ok: reasons.length === 0, reasons, replay: r };
}

/* Theoretical maximum for a chart: every note hit dead-on and every hold held to the end. The server
   rejects any claimed score above this before it even replays the log. */
function perfectRun(notes, opts = {}) {
  const j = new Judge(notes, opts);
  const ev = [];
  for (const n of j.notes) { ev.push([n.t, 0, n]); ev.push([n.t + (n.type === 'hold' ? n.dur : 0.03), -1, n]); }
  ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  for (const [t, k, n] of ev) k === 0 ? j.press(n.lane, t) : j.release(n.lane, t);
  j.update(Infinity);
  return j.result();
}

// ---- prototype-only: deterministic demo chart + synthesised backing (no audio files, no network) ----
const KB = (() => {
  const LANES = [
    { key: 'd', alt: 'arrowleft', color: '#22d3ee', dir: 'left', glyph: '◀', label: 'D' },
    { key: 'f', alt: 'arrowdown', color: '#e540ff', dir: 'down', glyph: '▼', label: 'F' },
    { key: 'j', alt: 'arrowup', color: '#facc15', dir: 'up', glyph: '▲', label: 'J' },
    { key: 'k', alt: 'arrowright', color: '#22e07a', dir: 'right', glyph: '▶', label: 'K' },
  ];
  const BPM = 120, BARS = 32, LEAD_IN = 2.0, STEP = 60 / BPM / 4;
  const DURATION_MS = Math.round((LEAD_IN + BARS * 16 * STEP + 2) * 1000);
  const OFFSET_MS = Math.round(LEAD_IN * 1000);

  function mulberry32(a) {
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* Notes in judge form {t(s), lane, type, dur?, dir?}. Built slot-by-slot on a 1/16 grid with the
     same hard rules the real validator enforces (lane gap, nothing inside a hold, <=2 fingers,
     no swipe while holding), so it passes games/kbeats/js/chart.js validate(). */
  function buildNotes(diff, seed) {
    const di = ['easy', 'normal', 'expert'].indexOf(diff);
    if (di < 0) throw new Error('unknown difficulty');
    const rnd = mulberry32((seed || 20261106) + di * 977);
    const W = [1, .15, .4, .15, .7, .15, .4, .15, 1, .15, .4, .15, .7, .2, .5, .3];
    const scale = [.62, .85, 1.7][di], gapMs = CONFIG.minLaneGapMs[diff];
    const lastMs = [-1e9, -1e9, -1e9, -1e9], holdEndMs = [-1e9, -1e9, -1e9, -1e9];
    const notes = []; let prevLane = -1, recent = [];
    for (let i = 0; i < BARS * 16; i++) {
      const pos = i % 16, bar = (i / 16) | 0;
      if (diff === 'easy' && pos % 4) continue;
      if (bar < 1 || bar >= BARS - 1) continue;                           // breathing room at both ends
      const breakBar = bar % 8 === 7;                                     // every 8th bar is a rest
      if (breakBar) continue;
      const ms = Math.round((LEAD_IN + i * STEP) * 1000);
      const free = [0, 1, 2, 3].filter(l => ms - lastMs[l] >= gapMs && ms > holdEndMs[l]);
      const held = holdEndMs.filter(e => e > ms).length;
      if (!free.length || held >= 2) continue;
      if (rnd() > Math.min(.95, W[pos] * scale)) continue;
      // lane: avoid immediate repeats, keep run length bounded
      let pool = free.filter(l => l !== prevLane); if (!pool.length) pool = free;
      const lane = pool[Math.floor(rnd() * pool.length)];
      let type = 'tap';
      const r = rnd();
      if (pos % 8 === 0 && diff !== 'expert' && r < .13 && held === 0) type = 'hold';
      else if (diff === 'expert' && pos % 8 === 0 && r < .09 && held === 0) type = 'hold';
      else if (diff !== 'easy' && held === 0 && r > (diff === 'normal' ? .9 : .84)) type = 'swipe';
      const n = { t: ms / 1000, lane, type };
      if (type === 'hold') {
        const slots = diff === 'expert' ? 3 : 4 + (rnd() < .4 ? 2 : 0);
        const endMs = ms + Math.round(slots * STEP * 1000);
        if (endMs > DURATION_MS - 500) continue;
        n.dur = (endMs - ms) / 1000; holdEndMs[lane] = endMs;
      }
      if (type === 'swipe') n.dir = LANES[lane].dir;
      notes.push(n); lastMs[lane] = ms; prevLane = lane;
      // optional chord partner on a strong slot (never with swipes, never above 2 fingers)
      if (diff !== 'easy' && type === 'tap' && pos % 8 === 0 && held === 0 && rnd() < (diff === 'normal' ? .16 : .3)) {
        const others = [0, 1, 2, 3].filter(l => l !== lane && ms - lastMs[l] >= gapMs && ms > holdEndMs[l]);
        if (others.length) { const l2 = others[Math.floor(rnd() * others.length)]; notes.push({ t: ms / 1000, lane: l2, type: 'tap' }); lastMs[l2] = ms; }
      }
    }
    return notes.sort((a, b) => a.t - b.t || a.lane - b.lane);
  }

  /* One mono AudioBuffer worth of samples: kick on every beat, snare on 2 and 4, 8th hats, a bass line. */
  function renderBacking(sampleRate) {
    sampleRate = sampleRate || 22050;
    const total = Math.ceil((DURATION_MS / 1000) * sampleRate), out = new Float32Array(total);
    const rnd = mulberry32(7);
    const add = (t0, len, fn) => { const s = Math.floor(t0 * sampleRate), n = Math.floor(len * sampleRate); for (let k = 0; k < n && s + k < total; k++) out[s + k] += fn(k / sampleRate, k / n); };
    const beat = 60 / BPM;
    for (let b = 0; LEAD_IN - beat * 2 + b * beat < DURATION_MS / 1000 - 0.3; b++) {
      const t = LEAD_IN - beat * 2 + b * beat;                              // 2 count-in beats before the first bar
      if (t < 0) continue;
      const inSong = t >= LEAD_IN - 1e-9, bar = Math.floor((t - LEAD_IN + 1e-9) / (beat * 4)), beatInBar = ((b - 2) % 4 + 4) % 4;
      add(t, 0.22, (x, p) => Math.sin(2 * Math.PI * (45 + 90 * Math.exp(-x * 28)) * x) * (1 - p) * 0.9);
      add(t + beat / 2, 0.05, (x, p) => (rnd() * 2 - 1) * (1 - p) * 0.12);
      add(t, 0.05, (x, p) => (rnd() * 2 - 1) * (1 - p) * 0.12);
      if (inSong && beatInBar % 2 === 1) add(t, 0.16, (x, p) => ((rnd() * 2 - 1) * 0.5 + Math.sin(2 * Math.PI * 190 * x) * 0.4) * (1 - p) * 0.35);
      if (inSong) {
        const f = [55, 55, 65.41, 49][bar % 4] * (beatInBar % 2 ? 2 : 1);
        add(t, beat * 0.9, (x, p) => ((((x * f) % 1) * 2 - 1) * 0.5 + Math.sin(2 * Math.PI * f * x) * 0.5) * (1 - p) * 0.28);
      }
    }
    let peak = 0; for (let i = 0; i < total; i++) peak = Math.max(peak, Math.abs(out[i]));
    if (peak > 0) for (let i = 0; i < total; i++) out[i] = out[i] / peak * 0.8;
    return out;
  }

  /* Falling-note geometry: fraction of the lane travelled (0 = spawn, 1 = hit line). */
  const progress = (noteT, songT, lead) => 1 - (noteT - songT) / lead;

  /* Resolve a touch/pointer x into a lane, or -1 outside the lanes. */
  function laneAt(x, left, width) { if (x < left || x >= left + width) return -1; return Math.min(3, Math.floor((x - left) / (width / 4))); }

  /* Flick direction from a drag vector. */
  function flickDir(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'); }

  return { LANES, BPM, BARS, LEAD_IN, STEP, DURATION_MS, OFFSET_MS, mulberry32, buildNotes, renderBacking, progress, laneAt, flickDir };
})();
//LOGIC-END

(function () {
  if (typeof document === 'undefined') return;
  const $ = id => document.getElementById(id);
  const cvs = $('c');
  let g = null; try { g = cvs.getContext('2d'); } catch (e) { g = null; }
  let diff = 'normal', offsetMs = 0, mode = 'menu';
  try { offsetMs = Math.max(-300, Math.min(300, +localStorage.getItem('kb-proto-offset') || 0)); } catch (e) {}
  const best = (() => { try { return JSON.parse(localStorage.getItem('kb-proto-best') || '{}') || {}; } catch (e) { return {}; } })();
  const saveBest = () => { try { localStorage.setItem('kb-proto-best', JSON.stringify(best)); } catch (e) {} };

  let judge = null, notes = [], ctx = null, startAt = 0, perfStart = 0, pausedAtWall = 0, raf = 0, endT = 0;
  let W = 0, H = 0, dpr = 1, flash = [0, 0, 0, 0], jtext = null, hypeToast = 0;
  const down = {};                        // key/pointer id -> {lane, t0, x, y, swiped}
  const laneDown = [0, 0, 0, 0];

  function clock() {
    if (typeof window.__kbClock === 'function') return window.__kbClock();
    if (ctx) return ctx.currentTime - startAt - offsetMs / 1000 - (ctx.outputLatency || ctx.baseLatency || 0);
    return (performance.now() - perfStart) / 1000 - offsetMs / 1000;
  }
  const lead = () => CONFIG.leadSec[diff];

  function geom() {
    const w = Math.min(W, 560), left = (W - w) / 2, hitY = H * 0.8, top = Math.max(60, H * 0.1);
    return { w, left, hitY, top };
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cvs.width = Math.floor(W * dpr); cvs.height = Math.floor(H * dpr);
    if (g) g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function setOffset(v) { offsetMs = Math.max(-300, Math.min(300, v)); $('offV').textContent = offsetMs + ' ms'; try { localStorage.setItem('kb-proto-offset', String(offsetMs)); } catch (e) {} }

  async function startGame() {
    notes = KB.buildNotes(diff);
    judge = new Judge(notes, { practice: $('practice').checked });
    endT = notes[notes.length - 1].t + (notes[notes.length - 1].dur || 0) + 1.2;
    flash = [0, 0, 0, 0]; jtext = null; Object.keys(down).forEach(k => delete down[k]);
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = null;
    if (AC && typeof window.__kbClock !== 'function') {
      try {
        ctx = new AC();
        const sr = ctx.sampleRate > 24000 ? 22050 : ctx.sampleRate;
        const data = KB.renderBacking(sr), buf = ctx.createBuffer(1, data.length, sr);
        buf.copyToChannel(data, 0);
        const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
        startAt = ctx.currentTime + 1.0; src.start(startAt);
        if (ctx.state === 'suspended') await ctx.resume();
      } catch (e) { ctx = null; }
    }
    if (!ctx) perfStart = performance.now() + 1000;
    $('menu').classList.add('hidden'); $('result').classList.add('hidden'); $('pause').classList.add('hidden');
    mode = 'play';
    cancelAnimationFrame(raf); loop();
  }

  function loop() { raf = requestAnimationFrame(loop); frame(); }

  function frame() {
    if (mode !== 'play' || !judge) { draw(clock()); return; }
    const t = clock();
    judge.update(t - CONFIG.expireLagMs / 1000);
    drainEvents(t);
    draw(t);
    if (judge.failed || t > endT) finish();
  }

  function drainEvents(t) {
    for (const e of judge.events) {
      if (e.j === 'hype') { hypeToast = performance.now(); continue; }
      if (e.lane >= 0) flash[e.lane] = performance.now();
      jtext = { j: e.j, at: performance.now() };
    }
    judge.events.length = 0;
  }

  function finish() {
    if (mode !== 'play') return;
    mode = 'result';
    judge.update(Infinity);
    const r = judge.result();
    if (!r.practice && !r.failed && (!best[diff] || r.score > best[diff])) { best[diff] = r.score; saveBest(); }
    const b = $('resBody'); b.textContent = '';
    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; b.appendChild(e); return e; };
    mk('div', 'grade', r.grade);
    mk('div', 'stars', r.failed ? 'FAILED' : '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars));
    const grid = document.createElement('div'); grid.className = 'res';
    [['Score', r.score], ['Accuracy', r.accuracy + '%'], ['Max combo', r.maxCombo], ['Perfect', r.perfect], ['Great', r.great], ['Good', r.good], ['Miss', r.miss], ['Best (' + diff + ')', best[diff] || '-']].forEach(([k, v]) => {
      const a = document.createElement('span'); a.textContent = k; const c = document.createElement('b'); c.textContent = v; grid.append(a, c);
    });
    b.appendChild(grid);
    if (r.fullCombo) mk('div', 'stars', 'FULL COMBO');
    const again = mk('button', 'go', 'Play again'); again.onclick = startGame;
    const menu = mk('button', 'go alt', 'Menu'); menu.onclick = toMenu;
    $('result').classList.remove('hidden'); again.focus();
    if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
    window.__kbResult = r;
  }
  function toMenu() { mode = 'menu'; $('result').classList.add('hidden'); $('pause').classList.add('hidden'); $('menu').classList.remove('hidden'); if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; } }

  function pause() {
    if (mode !== 'play') return;
    mode = 'pause'; pausedAtWall = performance.now();
    if (ctx) ctx.suspend();
    $('pause').classList.remove('hidden'); $('resume').focus();
  }
  function resume() {
    if (mode !== 'pause') return;
    if (ctx) ctx.resume(); else perfStart += performance.now() - pausedAtWall;
    mode = 'play'; $('pause').classList.add('hidden');
  }

  // ---- input ----
  function press(lane, id, x, y) {
    if (mode !== 'play') return;
    const t = clock(), src = id.startsWith('k') ? 'key' : 'touch';
    laneDown[lane] = 1; flash[lane] = performance.now();
    down[id] = { lane, t0: t, x, y, swiped: false };
    const j = judge.press(lane, t, src);
    if (j) jtext = { j, at: performance.now() };
  }
  function lift(id) {
    const d = down[id]; if (!d) return; delete down[id];
    if (mode !== 'play') return;
    laneDown[d.lane] = 0;
    const j = judge.release(d.lane, clock()); if (j) jtext = { j, at: performance.now() };
  }
  function move(id, x, y) {
    const d = down[id]; if (!d || d.swiped || mode !== 'play') return;
    const dx = x - d.x, dy = y - d.y;
    if (Math.hypot(dx, dy) >= CONFIG.swipeMinPx) {
      d.swiped = true;
      const j = judge.swipe(d.lane, d.t0, KB.flickDir(dx, dy)); if (j) jtext = { j, at: performance.now() };
    }
  }
  const keyLane = k => KB.LANES.findIndex(l => l.key === k || l.alt === k);
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'escape') { if (mode === 'play') pause(); else if (mode === 'pause') resume(); return; }
    if (k === 'enter' && mode === 'menu') { startGame(); return; }
    const lane = keyLane(k);
    if (lane < 0 || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (mode === 'play') { e.preventDefault(); press(lane, 'k' + lane, 0, 0); }
  });
  addEventListener('keyup', e => { const lane = keyLane(e.key.toLowerCase()); if (lane >= 0) lift('k' + lane); });
  cvs.addEventListener('pointerdown', e => {
    if (mode !== 'play') return;
    e.preventDefault(); try { cvs.setPointerCapture(e.pointerId); } catch (x) {}
    const gm = geom(), lane = KB.laneAt(e.clientX, gm.left, gm.w);
    if (lane >= 0) press(lane, 'p' + e.pointerId, e.clientX, e.clientY);
  });
  cvs.addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
  const up = e => lift('p' + e.pointerId);
  cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });

  // ---- drawing ----
  function draw(t) {
    if (!g) return;
    const gm = geom(), lw = gm.w / 4, now = performance.now();
    g.clearRect(0, 0, W, H);
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0b0620'); bg.addColorStop(1, '#1d0b3d');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const hype = judge && judge.hypeActive(t);
    for (let l = 0; l < 4; l++) {
      const x = gm.left + l * lw, c = KB.LANES[l].color;
      g.fillStyle = hype ? '#ffffff12' : '#ffffff08'; g.fillRect(x + 1, gm.top, lw - 2, gm.hitY - gm.top + 70);
      const f = Math.max(0, 1 - (now - flash[l]) / 180);
      if (f > 0 || laneDown[l]) { g.fillStyle = c + (laneDown[l] ? '55' : '33'); g.fillRect(x + 1, gm.top, lw - 2, gm.hitY - gm.top + 70); }
      g.strokeStyle = c; g.lineWidth = 3; g.strokeRect(x + 6, gm.hitY - 14, lw - 12, 28);
      g.fillStyle = '#ffffffcc'; g.font = '700 16px system-ui'; g.textAlign = 'center';
      g.fillText(KB.LANES[l].label, x + lw / 2, gm.hitY + 52);
    }
    if (judge && mode !== 'menu') {
      const L = lead(), span = gm.hitY - gm.top;
      for (const n of judge.notes) {
        if (n.state === 2 && !(n.type === 'hold' && n.t + n.dur > t)) continue;
        const p = KB.progress(n.t, t, L);
        const yHead = gm.top + p * span;
        const tail = n.type === 'hold' ? gm.top + KB.progress(n.t + n.dur, t, L) * span : yHead;
        if (yHead < gm.top - 40 && tail < gm.top - 40) continue;
        if (tail > H + 40 && yHead > H + 40) continue;
        const x = gm.left + n.lane * lw, c = KB.LANES[n.lane].color;
        if (n.type === 'hold') {
          const y0 = Math.min(tail, yHead), h = Math.abs(yHead - tail);
          g.fillStyle = c + (n.state === 1 ? 'cc' : '66'); g.fillRect(x + lw * 0.3, Math.max(gm.top, y0), lw * 0.4, h);
        }
        const y = n.type === 'hold' && n.state === 1 ? gm.hitY : yHead;
        g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 12;
        g.beginPath(); g.roundRect ? g.roundRect(x + 8, y - 12, lw - 16, 24, 8) : g.rect(x + 8, y - 12, lw - 16, 24); g.fill(); g.shadowBlur = 0;
        if (n.type === 'swipe') { g.fillStyle = '#10002a'; g.font = '700 18px system-ui'; g.textAlign = 'center'; g.fillText(KB.LANES.find(q => q.dir === n.dir).glyph, x + lw / 2, y + 6); }
      }
      // HUD
      g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = '800 26px system-ui'; g.fillText(String(judge.score), 14, 36);
      g.font = '600 13px system-ui'; g.fillStyle = '#a79bd0'; g.fillText('ACC ' + (judge.accuracy * 100).toFixed(1) + '%', 14, 56);
      g.textAlign = 'center';
      if (judge.combo > 1) { g.fillStyle = '#fff'; g.font = '800 34px system-ui'; g.fillText(judge.combo + ' combo', W / 2, gm.top + span * 0.35); g.font = '700 14px system-ui'; g.fillStyle = '#e540ff'; g.fillText('x' + multiplierFor(judge.combo) + (hype ? ' HYPE x2' : ''), W / 2, gm.top + span * 0.35 + 22); }
      if (jtext && now - jtext.at < 450) { g.globalAlpha = 1 - (now - jtext.at) / 450; g.font = '800 22px system-ui'; g.fillStyle = { perfect: '#facc15', great: '#22e07a', good: '#22d3ee', miss: '#ff4d6d' }[jtext.j]; g.fillText(jtext.j.toUpperCase(), W / 2, gm.hitY - 60); g.globalAlpha = 1; }
      if (now - hypeToast < 1200) { g.fillStyle = '#e540ff'; g.font = '800 28px system-ui'; g.fillText('HYPE!', W / 2, gm.top + 30); }
      const bw = Math.min(150, W * 0.3), bx = W - bw - 14;
      g.fillStyle = '#ffffff22'; g.fillRect(bx, 24, bw, 8); g.fillStyle = judge.health > 0.3 ? '#22e07a' : '#ff4d6d'; g.fillRect(bx, 24, bw * judge.health, 8);
      g.fillStyle = '#ffffff22'; g.fillRect(bx, 38, bw, 5); g.fillStyle = '#e540ff'; g.fillRect(bx, 38, bw * (hype ? Math.max(0, (judge.hypeUntil - t) / CONFIG.hype.durationSec) : judge.hype), 5);
    }
  }

  // ---- menu wiring ----
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { diff = b.dataset.d; document.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('sel', x === b)); });
  $('start').onclick = startGame; $('resume').onclick = resume; $('quit').onclick = toMenu;
  $('offM').onclick = () => setOffset(offsetMs - 10); $('offP').onclick = () => setOffset(offsetMs + 10);
  addEventListener('resize', resize);
  resize(); setOffset(offsetMs); draw(0);
  window.__kb = { frame, state: () => ({ mode, diff, notes, judge }), press, lift, finish };
})();
</script>
</body>
</html>
