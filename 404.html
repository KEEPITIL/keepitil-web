<!-- ============================================================================
     THIS IS THE KEEPITIL URL ROUTER.  It is NOT an error page.

     WHY IT IS CALLED 404.html: GitHub Pages only ever serves ONE file for an
     unmatched path, and that file MUST be named 404.html at the repo root.
     The name is fixed by the hosting platform — it cannot be renamed without
     losing every clean URL on the site.

     WHAT IT DOES: translates pretty URLs into real pages, e.g.
        /culture              -> /culture/
        /games                -> /games/
        /profile/<handle>     -> /profile?slug=<handle>
        /event/<slug>         -> /event?e=<slug>
        /venue/<slug>         -> /venue?v=<slug>
        /unclaimed/profile/<handle>, /culture/feed, and the single-segment clean
        URLs in CLEAN_URL_PAGES (/apply -> apply.html and so on)

     SHOPIFY STOREFRONT (owner order 2026-11-05):
        /products/*, /collections/*, /cart → https://www.illestratedlifestyle.com + same path
        Query string and hash are preserved (UTMs such as launch-wk-2026-11 survive).

     The /radio, /vs and /scene lines that used to sit in this list were removed on
     2026-09-09. Those surfaces are RETIRED: the router stopped translating them, so
     this documentation had been describing behaviour the file no longer had. Retired
     KEEPITIL architectures stay retired - they are not resurrected as aliases.

     DELETE THIS FILE AND EVERY CLEAN URL ABOVE BREAKS AT ONCE.
     Only if a path matches nothing does it fall through to the "not found"
     panel below — which is why opening it directly looks blank/dead.
============================================================================ -->
