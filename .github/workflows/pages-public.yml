# Publish only the public site.
#
# keepitil.com is a branch deploy today, and .nojekyll is present, so Jekyll
# never applies an exclude list. Removing .nojekyll would let Jekyll rewrite
# `{{` in game JavaScript (games/kbeats/js/app.js and others). This workflow
# copies tracked files as-is, drops the paths in scripts/publish-public-site.py,
# and uploads that directory as the Pages artifact.
#
# It does nothing to the live site until Pages is set to GitHub Actions:
# Settings → Pages → Build and deployment → Source → GitHub Actions.
# Until that switch, the branch deploy keeps publishing the whole repo,
# and this job cannot deploy.

name: Publish public site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Copy public files
        run: python3 scripts/publish-public-site.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
