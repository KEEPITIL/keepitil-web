<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TUITEA email link</title>
<!--
  WHERE A TUITEA EMAIL LINK LANDS WHEN THE APP DID NOT CATCH IT.

  On an iPhone with TUITEA installed, iOS opens the APP for https://keepitil.com/join/*
  (apple-app-site-association) and this page is never seen. It exists for the other cases:
  the app is not installed, the link was opened on a computer, or a mail client forced it
  into a browser tab.

  BUILD 88 PHASE 2. This page used to assume every link was a password reset, and told a NEW
  member who had just confirmed their address to "choose Forgot password". A confirmation
  (sign-up, a new email address) is already done by the time Supabase sends the browser here —
  Supabase confirms first, then redirects — so the page now says so and offers sign-in.

  A PKCE ?code= still belongs to the app that asked for it; this page does not redeem it.
  A sign-up token_hash (?flow=confirm, or type=signup) is verified here with type=signup,
  then the session is dropped. type=recovery is left untouched.
-->
<style>
  :root{--bg:#FBF7EF;--ink:#20261F;--muted:#6E7566;--ocean:#33777D;--line:#E2D9C6;--surface:#FFFDF8}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14170F;--ink:#ECE7DA;--muted:#9BA391;--ocean:#6FBFC5;--line:#333A2D;--surface:#1C201A}}
  :root[data-theme="dark"]{--bg:#14170F;--ink:#ECE7DA;--muted:#9BA391;--ocean:#6FBFC5;--line:#333A2D;--surface:#1C201A}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding:24px 16px}
  .card{max-width:34rem;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.4rem}
  h1{font-size:1.35rem;margin:0 0 .5rem}
  p{margin:0 0 .8rem;color:var(--muted)}
  a.btn{display:inline-block;background:var(--ocean);color:#fff;text-decoration:none;font-weight:600;padding:.7rem 1.1rem;border-radius:999px;margin:.2rem .2rem .2rem 0}
  a{color:var(--ocean)}
  .small{font-size:.9rem}
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Almost there</h1>
    <p id="msg">This link came from TUITEA. If TUITEA is installed on this iPhone, open the same link from the Mail app and it will open TUITEA directly.</p>
    <p>
      <a class="btn" id="signin" href="https://keepitil.com/app/tuitea/app/">Sign in to TUITEA on the web</a>
    </p>
    <p class="small" id="next">On iPhone, open TUITEA and sign in with your email and password.</p>
  </div>
  <script type="module">
    import { confirmOtpType, isConfirmFlow } from './confirm.mjs';

    const SUPABASE_URL = 'https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';

    const title = document.getElementById('title');
    const msg = document.getElementById('msg');
    const next = document.getElementById('next');

    function confirmed() {
      title.textContent = 'Your email is confirmed';
      msg.textContent = 'Thank you. You can sign in to TUITEA now with your email and password.';
    }

    try {
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      const type = (q.get('type') || h.get('type') || '').toLowerCase();
      const err = h.get('error_description') || q.get('error_description') || h.get('error') || q.get('error');
      const code = q.get('code');
      const recovery = type === 'recovery' || type === 'magiclink';
      const otpType = confirmOtpType(location.search, location.hash);

      if (err) {
        const expired = /expired|invalid|already/i.test(decodeURIComponent(String(err).replace(/\+/g, ' ')));
        title.textContent = 'That link could not be used';
        if (recovery) {
          msg.textContent = (expired ? 'That link has expired or was already used. ' : '') +
            'Nothing on your account has changed. Open TUITEA and tap Forgot Password to get a new one.';
        } else {
          msg.textContent = (expired ? 'That link has expired or was already used. ' : '') +
            'If you already confirmed your email, just sign in. If not, sign in to TUITEA and tap ' +
            '“Resend confirmation email” for a new link.';
        }
      } else if (otpType) {
        title.textContent = 'Checking your link…';
        msg.textContent = '';
        const token = q.get('token_hash') || h.get('token_hash');
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.45.4');
        const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
        });
        const { error } = await sb.auth.verifyOtp({ token_hash: token, type: otpType });
        try { await sb.auth.signOut(); } catch {}
        history.replaceState(null, '', location.pathname + '?flow=confirm');
        if (error) {
          title.textContent = 'That link could not be used';
          msg.textContent = 'That confirmation link has expired or was already used. If you already confirmed your email, just sign in.';
        } else {
          confirmed();
        }
      } else if (isConfirmFlow(location.search, location.hash) || (code && !recovery)) {
        confirmed();
      } else if (recovery) {
        title.textContent = 'Open this link in TUITEA';
        msg.textContent = 'This link signs you in or resets your password, and it works in the TUITEA app. ' +
          'On iPhone, open the same link from the Mail app. Nothing on your account has changed.';
      }
    } catch (e) {
      if (title && title.textContent === 'Checking your link…') {
        title.textContent = 'That link could not be used';
        msg.textContent = 'That confirmation link could not be checked. Check your connection and try the link again.';
      }
    }
  </script>
</body>
</html>
