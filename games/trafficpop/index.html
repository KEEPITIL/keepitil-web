<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a7de1">
<title>Traffic Pop — KEEPITIL</title>
<meta name="description" content="Traffic Pop: clear the jam, park smart and load matching passengers. A free puzzle game by KEEPITIL.">
<link rel="stylesheet" href="style.css?v=681ecefe89">
<link rel="stylesheet" href="skin.css?v=1.1b5">
</head>
<body>
<main id="app">
  <section id="map" class="screen">
    <div class="title">
      <div id="logoCar" class="logo-car"></div>
      <h1 class="logo"><span>Traffic</span><span>Pop</span></h1>
      <p class="tag">Clear the jam · Park smart · Load the passengers</p>
      <button class="big" id="play">PLAY</button>
    </div>
    <div id="levels" class="levels"></div>
    <p class="legal">A free KEEPITIL game · no ads · progress saved on this device · <a href="CHANGELOG.txt">build 681ecefe89</a></p>
  </section>

  <section id="game" class="screen hidden">
    <header class="hud">
      <button class="chip-btn" id="home" aria-label="Levels"></button>
      <div class="hud-mid"><div class="hud-lvl">LEVEL <b id="lvl">1</b></div><div class="meter" aria-hidden="true"><i id="bar"></i></div><small id="goal">0 / 0 passengers</small></div>
      <div class="hud-moves"><small>MOVES</small><b id="moves">0</b></div>
      <button class="chip-btn" id="settings" aria-label="Settings"></button>
    </header>
    <div class="side">
      <div class="terminal" id="terminal">
        <div class="dock" id="dockA" aria-live="polite"></div>
        <div class="dock" id="dockB" aria-live="polite"></div>
      </div>
      <div class="lot" id="lot">
        <div class="lot-title" id="parkCount">PARKING 0 / 6</div>
        <div class="bays" id="bays"></div>
      </div>
      <nav class="tools">
        <button id="hint"><span class="ic"></span><span>Hint</span></button>
        <button id="undo"><span class="ic"></span><span>Undo</span></button>
        <button id="restart"><span class="ic"></span><span>Restart</span></button>
        <button id="space" class="helper" aria-label="Add a parking space"><span class="ic"></span><span>Space</span><b id="spaceN">0</b></button>
        <button id="lift" class="helper" aria-label="Lift a vehicle"><span class="ic"></span><span>Lift</span><b id="liftN">0</b></button>
      </nav>
    </div>
    <div id="board" class="board"></div>
  </section>

  <div id="fx" class="fx" aria-hidden="true"></div>
  <div id="overlay" class="overlay hidden"><div class="card" id="ovBody"></div></div>
  <div id="toast" class="toast" role="status"></div>
</main>
<script src="app.js?v=681ecefe89-skin1.1b4"></script>
<script src="skin-map.js?v=1.1b5"></script>
</body>
</html>
