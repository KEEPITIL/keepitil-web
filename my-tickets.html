*{box-sizing:border-box;margin:0;padding:0}

.m4-failed{text-align:center;padding:40px 0}
.m4-note{color:var(--muted,#9aa);font-size:.82rem;margin-bottom:10px}
.m4-sec{margin-bottom:18px}

.m4-past .m4-card{opacity:.7}
.m4-cover{flex:0 0 64px;height:64px;border-radius:10px;background:#0a0a12 center/cover no-repeat}
.m4-cover-0{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--brand,#00b4ff);border:1.5px solid var(--brand,#00b4ff)}
.m4-body{display:flex;flex-direction:column;min-width:0;flex:1}
.m4-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m4-when{font-size:.82rem;font-weight:700;color:var(--brand-2,#22e39b)}
.m4-where,.m4-meta{font-size:.8rem;color:var(--muted,#9aa)}
.m4-in{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--line,#2a2a38);font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.m4-go{font-size:1.6rem;color:var(--muted,#9aa);flex:0 0 auto}
.m4-gate{max-width:460px;margin:40px auto;background:var(--surface,#15151f);border:1px solid var(--line,#2a2a38);border-radius:18px;padding:30px 24px;text-align:center}
.m4-gate h2{font-size:1.3rem;font-weight:800;margin-bottom:8px}.m4-gate p{color:var(--muted,#9aa);margin-bottom:16px}
.m4-cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--brand,#00b4ff);color:#001018;font-weight:900;text-decoration:none}
