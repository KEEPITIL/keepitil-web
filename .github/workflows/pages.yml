# Publishes keepitil.com with GitHub Actions instead of the legacy "Deploy from a branch" build.
# The artifact is the repo tree minus .github/pages-exclude.txt (tests, docs, source originals,
# debug symbols). CNAME and .nojekyll are always kept, and a link-closure check fails the build
# if anything deployed points at a file that was excluded.
#
# This only deploys once Settings > Pages > Source is "GitHub Actions" (build_type=workflow).
# Until then the deploy job fails harmlessly and the legacy branch deploy keeps serving the site.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage _site (repo minus .github/pages-exclude.txt)
        run: node scripts/pages-build.mjs --src . --out _site --exclude .github/pages-exclude.txt
      - name: Verify CNAME, index.html and link closure
        run: node scripts/pages-closure-check.mjs --site _site --source . --list-preexisting
      - name: Artifact size
        run: du -sh _site && find _site -type f | wc -l
      # Stay on v3: v4+ leaves out dot-directories, which would drop .well-known/.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
