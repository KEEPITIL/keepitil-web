/* M1 simple profile (Grok aadba32b). Public: name, avatar, bio, links, upcoming events, music.
   Private (owner only): tickets, saved events, host-events dashboard, settings. Read only. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#0a0a0f);color:var(--text,#fff);font-family:var(--font,Inter,sans-serif);line-height:1.5;padding:22px 0 48px}
.m1{max-width:760px;margin:0 auto;padding:0 16px}
.m1-loading,.m1-empty{color:var(--muted,#9aa);padding:14px 0}
.m1-missing{text-align:center;padding:60px 0}
.m1-head{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.m1-av{width:88px;height:88px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid var(--brand,#00b4ff);background:var(--surface,#15151f)}
.m1-av-0{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:var(--brand,#00b4ff)}
.m1-name{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;letter-spacing:.02em}
.m1-handle,.m1-loc{color:var(--muted,#9aa);font-size:.86rem}
.m1-tag{font-weight:600;margin-top:2px}
.m1-sec{background:var(--surface,#15151f);border:1px solid var(--line,#2a2a38);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.m1-sec h2{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-2,#22e39b);margin-bottom:10px}
.m1-bio{white-space:pre-line}
.m1-chips{display:flex;flex-wrap:wrap;gap:8px}
.m1-chip{display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;border:1.5px solid var(--brand,#00b4ff);color:var(--brand,#00b4ff);font-weight:700;font-size:.86rem;text-decoration:none}
.m1-music{border-color:var(--brand-2,#22e39b);color:var(--brand-2,#22e39b)}
.m1-evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.m1-ev{display:flex;flex-direction:column;gap:3px;padding:10px;border:1px solid var(--line,#2a2a38);border-radius:12px;color:inherit;text-decoration:none;min-width:0}
.m1-ev-img{display:block;aspect-ratio:16/9;border-radius:8px;background:#0a0a12 center/cover no-repeat;margin-bottom:4px}
.m1-ev-t{font-weight:800}
.m1-ev-m,.m1-ev-x{font-size:.8rem;color:var(--muted,#9aa)}
.m1-list{display:flex;flex-direction:column;gap:6px}
.m1-row{padding:10px 12px;border:1px solid var(--line,#2a2a38);border-radius:10px;color:inherit;text-decoration:none;font-weight:600}
.m1-private{margin-top:22px}
.m1-private-label{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#9aa);margin:0 0 8px 2px}
@media (max-width:420px){.m1-av{width:72px;height:72px}.m1-name{font-size:1.9rem}}
</style>
</head>
