<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUITEA</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="/apps/tuitea/">
<!--
  /app/tuitea/ redirects to /apps/tuitea/. GitHub Pages cannot send a 301.
  Meta refresh is the no-JavaScript hop (it cannot see the query string or hash).
  The script uses location.replace so both are kept.
  This file loads no site shell, no analytics, and no TUITEA worker.
  The site has no Content-Security-Policy meta, so this script stays inline.
  /app/tuitea with no slash is the host's 301 to this directory; the query
  string is kept on that hop and the hash never leaves the browser.
-->
<meta http-equiv="refresh" content="0; url=/apps/tuitea/">
<script>location.replace("/apps/tuitea/" + location.search + location.hash);</script>
</head>
<body>
<p><a id="tuitea-continue" href="/apps/tuitea/">Continue to TUITEA</a></p>
<script>
(function () {
  var dest = "/apps/tuitea/" + location.search + location.hash;
  var link = document.getElementById("tuitea-continue");
  if (link) link.href = dest;
  location.replace(dest);
})();
</script>
</body>
</html>
