<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Set your TUITEA password</title>
<!--
  THE PASSWORD PAGE. IT HAS EXACTLY ONE JOB.

  Prove control of an email address and set a password on the EXISTING Supabase
  user. Then get out of the way.

  ── WHAT THIS PAGE DELIBERATELY DOES NOT DO ──────────────────────────────────
  It does not hand a session back to the app. That chain — Supabase email →
  redirect → AASA → universal link → in-app listener → OTP exchange → household
  resolution — is what cost this project weeks and never worked on the owner's
  phone. There is nothing to hand over: TUITEA signs in with the password
  afterwards, like any normal application.

  It is not a web version of TUITEA: it never signs the browser in to the app.
  BUILD 88 PHASE 2 (owner: "fix the /password page dead end"): every state now
  offers a way forward. A failed or expired link offers "Email me a new link"
  right here (rate limits said as a wait); a finished password, and a
  confirmation link (?flow=confirm, a new account's "Confirm your email"), offer
  sign-in — TUITEA on the web (/app/tuitea/app/, the app's own front door) or
  the app on the phone. The page itself still holds no session afterwards.

  It signs itself OUT the moment the password is saved, so a recovery link
  opened on a borrowed or shared device does not leave a live session behind in
  that browser.
-->
<style>
  :root{
    --bg:#FBF7EF; --ink:#20261F; --muted:#6E7566; --ocean:#33777D;
    --line:#E2D9C6; --surface:#FFFDF8; --warn:#B4472F;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14170F; --ink:#ECE7DA; --muted:#9BA391; --ocean:#6FBFC5;
    --line:#333A2D; --surface:#1C201A; --warn:#E38B72;
  }}
  :root[data-theme="dark"]{
    --bg:#14170F; --ink:#ECE7DA; --muted:#9BA391; --ocean:#6FBFC5;
    --line:#333A2D; --surface:#1C201A; --warn:#E38B72;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);
       color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:24px}
  main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
       border-radius:16px;padding:26px}
  h1{margin:0 0 4px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ocean)}
  h2{margin:0 0 18px;font-size:21px;line-height:1.25}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
        border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
  input:focus-visible{outline:2px solid var(--ocean);outline-offset:1px}
  button{width:100%;margin-top:20px;padding:14px;min-height:48px;font-size:16px;font-weight:600;
         border:0;border-radius:10px;background:var(--ocean);color:#fff;cursor:pointer}
  button[disabled]{opacity:.5;cursor:default}
  p{color:var(--muted);font-size:13.5px}
  .msg{margin-top:14px;font-size:13.5px}
  .err{color:var(--warn)}
  .done h2{margin-bottom:10px}
  [hidden]{display:none!important}
  a.go{display:block;text-align:center;margin-top:16px;padding:14px;min-height:48px;font-weight:600;
       border-radius:10px;background:var(--ocean);color:#fff;text-decoration:none}
  .signin{margin-top:14px}
  .signin a{color:var(--ocean);font-weight:600}
  .ok{color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>TUITEA</h1>

  <div id="form-view">
    <h2>Set your password</h2>
    <p id="intro">Checking your link…</p>
    <div id="fields" hidden>
      <!-- autocomplete="new-password" is what makes iOS offer to generate and
           save a strong password here, rather than trying to fill an old one. -->
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8"
             placeholder="At least 8 characters">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8">
      <button id="save" disabled>Save password</button>
    </div>
    <div id="msg" class="msg"></div>

    <!-- The way forward when the link did not work: a new one, sent from here. -->
    <div id="again" hidden>
      <label for="again-email">Your email</label>
      <input id="again-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
      <button id="again-send">Email me a new link</button>
      <div id="again-msg" class="msg"></div>
      <p class="signin">Already set your password? <a href="/app/tuitea/app/">Sign in to TUITEA</a></p>
    </div>
  </div>

  <div id="done-view" class="done" hidden>
    <h2 id="done-title">Your password has been updated.</h2>
    <p id="done-body">Sign in to TUITEA with your email and this password.</p>
    <a class="go" href="/app/tuitea/app/">Sign in to TUITEA on the web</a>
    <p>On iPhone, open the TUITEA app and sign in there.</p>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

const SUPABASE_URL = 'https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
// The publishable (anon) key. Public by design: it grants nothing on its own,
// and row-level security decides everything. The recovery token in the URL is
// what authorises the password change, and it is single-use and short-lived.
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';

// persistSession:false is the important one. A recovery link may be opened on a
// borrowed phone or a shared computer; nothing about it should survive the tab.
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

const $ = (id) => document.getElementById(id);
const intro = $('intro'), fields = $('fields'), msg = $('msg');
const pw = $('pw'), pw2 = $('pw2'), save = $('save');

const PAGE = 'https://keepitil.com/app/tuitea/password/';
const CONFIRM = PAGE + '?flow=confirm';
let confirmFlow = false;

// A failure is never the end: say what happened, then offer a new link right here.
const fail = (text) => {
  intro.textContent = ''; msg.className = 'msg err'; msg.textContent = text;
  $('again').hidden = false;
  $('again-send').textContent = confirmFlow ? 'Email me a new confirmation link' : 'Email me a new link';
};

const confirmed = () => {
  $('form-view').hidden = true;
  $('done-title').textContent = 'Your email is confirmed.';
  $('done-body').textContent = 'You can sign in to TUITEA now with your email and password.';
  $('done-view').hidden = false;
};

// Supabase's own limits, said as a wait — never as "sent".
const limitWords = (e) => {
  const code = (e && (e.code || '')) + '', status = e && e.status;
  if (code === 'over_email_send_rate_limit' || status === 429 && /email/i.test(e.message || ''))
    return 'Too many emails have been requested just now. Please wait a few minutes, then try again.';
  if (code === 'over_request_rate_limit' || status === 429)
    return 'Too many attempts just now. Please wait a minute, then try again.';
  return null;
};

$('again-send').addEventListener('click', async () => {
  const out = $('again-msg'), btn = $('again-send');
  const email = $('again-email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    out.className = 'msg err'; out.textContent = "That doesn't look like an email address."; return;
  }
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Sending…';
  let error = null;
  try {
    const r = confirmFlow
      ? await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: CONFIRM } })
      : await sb.auth.resetPasswordForEmail(email, { redirectTo: PAGE });
    error = r.error;
  } catch (e) { error = e; }
  btn.textContent = label;
  if (error) {
    btn.disabled = false;
    out.className = 'msg err';
    out.textContent = limitWords(error) || "We couldn't send the email just now. Check your connection and try again.";
    return;
  }
  // Only after Supabase accepted it. Worded so it never says whether an account exists.
  out.className = 'msg ok';
  out.textContent = 'Sent. If ' + email + ' has a TUITEA account, a new email is on its way — check Spam or Junk too.';
  setTimeout(() => { btn.disabled = false; }, 60000);
});

async function begin() {
  const url = new URL(location.href);
  const params = url.searchParams;
  const hash = new URLSearchParams(url.hash.replace(/^#/, ''));

  const flowType = (params.get('type') || hash.get('type') || '').toLowerCase();
  confirmFlow = params.get('flow') === 'confirm' || ['signup', 'email', 'email_change', 'invite'].includes(flowType);

  const problem = params.get('error_description') || hash.get('error_description');
  if (problem) {
    return fail(/expired|invalid|already/i.test(problem)
      ? 'That link has expired or was already used. Nothing on your account has changed — get a new one below.'
      : 'That link did not work. Nothing on your account has changed — get a new one below.');
  }

  // A NEW ACCOUNT'S CONFIRMATION (build 88 phase 2). Supabase confirms the address before it
  // redirects here; the app's PKCE code cannot be redeemed in this browser and is not needed.
  // An older-style confirmation with a token_hash is verified, then the session is dropped.
  if (confirmFlow) {
    const th = params.get('token_hash');
    if (th) {
      const { error } = await sb.auth.verifyOtp({ token_hash: th, type: flowType || 'email' });
      if (error) return fail('That confirmation link has expired or was already used. If you already confirmed, just sign in — otherwise get a new one below.');
      try { await sb.auth.signOut(); } catch {}
    }
    history.replaceState(null, '', location.pathname);
    return confirmed();
  }

  // Two shapes reach this page: the current token_hash form, and the older
  // fragment form still sitting in inboxes. Both are accepted; neither is
  // preferred, because a person cannot tell which one they were sent.
  const tokenHash = params.get('token_hash');
  const type = params.get('type') || 'recovery';
  const accessToken = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');

  try {
    if (tokenHash) {
      const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type });
      if (error) throw error;
    } else if (accessToken && refreshToken) {
      const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if (error) throw error;
    } else {
      return fail('This page needs the link from a TUITEA password email. Get a new one below.');
    }
  } catch (e) {
    return fail('That link has expired or has already been used. Nothing on your account has changed — get a new one below.');
  }

  // The token is spent. Take it out of the address bar so it is not left in
  // history, or in a screenshot, or in a shared URL.
  history.replaceState(null, '', location.pathname);

  intro.textContent = 'Choose a password for your TUITEA account.';
  fields.hidden = false;
  pw.focus();
}

const check = () => {
  const ok = pw.value.length >= 8 && pw.value === pw2.value;
  save.disabled = !ok;
  msg.className = 'msg err';
  msg.textContent = (pw2.value && pw.value !== pw2.value) ? 'Those passwords do not match.' : '';
};
pw.addEventListener('input', check);
pw2.addEventListener('input', check);

save.addEventListener('click', async () => {
  save.disabled = true;
  save.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: pw.value });
  if (error) {
    save.disabled = false;
    save.textContent = 'Save password';
    msg.className = 'msg err';
    msg.textContent = error.message || 'Could not save that password. Try again.';
    return;
  }
  // End the recovery session immediately. This browser is not a way into
  // TUITEA and must not be left holding a key to the family's records.
  try { await sb.auth.signOut(); } catch {}
  $('form-view').hidden = true;
  $('done-view').hidden = false;
});

begin();
</script>
</body>
</html>
