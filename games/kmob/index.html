<style>
:root{--ink:#0e1a33;--panel:rgba(14,26,51,.86);--line:rgba(255,255,255,.14);--gold:#ffc83a;--blue:#2f74ff;--red:#e2312c;--green:#2fbf4f;--tx:#fff;--disp:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0e1a33;color:var(--tx);font-family:Nunito,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.disp{font-family:var(--disp);letter-spacing:.02em;font-weight:400}
.hidden{display:none!important}
/* HUD */
#postureBtn{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:6;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;height:58px;padding:0 12px;border-radius:16px;font-family:var(--disp);font-size:22px;letter-spacing:.04em;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;border:2px solid rgba(255,255,255,.65);box-shadow:0 5px 0 rgba(0,0,0,.3);background:linear-gradient(#ff5a3a,#d8281c);transition:transform .08s}
@keyframes ubp{50%{transform:scale(1.08)}}
#intro{position:fixed;inset:0;z-index:40;background:#070d1c;display:grid;place-items:center;color:#fff;text-align:center;cursor:pointer}
#intro .il{font-family:var(--disp);letter-spacing:.12em;opacity:0;transition:opacity .22s}#intro .il.on{opacity:1}#intro small{display:block;font-family:Nunito,sans-serif;font-weight:900;font-size:12px;letter-spacing:.3em;opacity:.7;margin-bottom:6px}#intro b{font-size:44px;font-weight:400}#intro b.logo{font-size:76px;color:#ffd23a;text-shadow:0 4px 0 #b4560c}
#postureBtn.def{background:linear-gradient(#4f8dff,#2353c7)}
#postureBtn:active{transform:translateY(3px)}
#postureBtn small{font-family:inherit;font-size:9px;font-weight:900;opacity:.85;letter-spacing:.1em;margin-top:2px}
#pauseBtn i{display:inline-block;width:5px;height:16px;background:#fff;margin:0 2px;border-radius:2px}
#hpbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);width:min(220px,46vw);height:8px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;z-index:5;pointer-events:none;border:1px solid rgba(255,255,255,.2)}

#vig{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 120px 30px rgba(220,20,20,.0);transition:box-shadow .3s}
#vig.warn{animation:warnPulse .55s ease-in-out infinite alternate}
@keyframes warnPulse{from{background:radial-gradient(ellipse at center,transparent 55%,rgba(255,30,30,.0))}to{background:radial-gradient(ellipse at center,transparent 55%,rgba(255,30,30,.32))}}
/* upgrade cards */
/* prompts */
#tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 44vh);text-align:center;padding-left:84px;padding-right:12px;z-index:5;pointer-events:none;transition:opacity .4s}
#tip .big{font-family:var(--disp);font-size:clamp(28px,7vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 20px rgba(0,0,0,.3)}
#tip .sm{font-weight:900;font-size:13px;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#tip .hand{width:130px;height:60px;margin:0 auto 4px;position:relative}
#tip .hand svg{position:absolute;left:50%;top:0;width:46px;margin-left:-23px;animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;z-index:6;pointer-events:none;font-family:var(--disp);font-size:clamp(20px,6.5vw,46px);padding:0 12px;line-height:1.05;color:#fff;text-shadow:0 3px 0 #7a0d0d,0 0 30px rgba(255,40,40,.7);white-space:pre-line;opacity:0;transition:opacity .25s}
#banner.on{opacity:1;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
/* panels */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(14,26,51,.35),rgba(14,26,51,.82));padding:16px}
.panel{width:min(92vw,400px);background:linear-gradient(180deg,#16284f,#0e1a33);border:2px solid rgba(255,255,255,.16);border-radius:22px;padding:20px 18px 18px;box-shadow:0 10px 0 rgba(0,0,0,.3),0 20px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.btn{font-family:var(--disp);font-size:26px;border:0;border-radius:16px;padding:12px 18px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#7dff4a,#2fbf2f);box-shadow:0 6px 0 #1a7a1a,0 10px 20px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.25);width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1a7a1a}
.btn.sec{background:linear-gradient(180deg,#3a5a9a,#24407a);box-shadow:0 6px 0 #142852;font-size:18px}
.btn.sec:active{box-shadow:0 2px 0 #142852}
.row{display:flex;gap:10px;align-items:stretch}
.sq{width:64px;flex:none;padding:8px 0;font-size:13px;display:grid;place-items:center;gap:2px}
.sq svg{width:28px;height:28px}
#title h1{margin:0;font-size:clamp(54px,15vw,84px);line-height:.9;text-align:center;color:#fff;text-shadow:0 5px 0 #1f4fbf,0 10px 0 rgba(0,0,0,.25)}
#title h2{margin:6px 0 2px;text-align:center;font-size:18px;color:var(--gold);letter-spacing:.12em}
#title p{text-align:center;opacity:.85;font-weight:800;margin:10px 0 18px;font-size:14px}
.best{display:flex;justify-content:center;gap:16px;margin:-6px 0 16px;font-weight:900;font-size:13px;opacity:.9}
.best b{color:var(--gold);font-family:var(--disp);font-weight:400;font-size:18px;margin-left:4px}
#over .sv{text-align:center;font-family:var(--disp);font-size:22px;letter-spacing:.06em}
#over .tm{text-align:center;font-family:var(--disp);font-size:clamp(56px,16vw,76px);line-height:1;color:var(--gold);text-shadow:0 4px 0 #9a5a00}
#over .pb{text-align:center;color:#7dff6a;font-family:var(--disp);font-size:18px;margin-top:2px;min-height:22px}
.stats{margin:12px 0 16px;border:1px solid var(--line);border-radius:14px;padding:6px 12px;background:rgba(0,0,0,.18)}
.stats div{display:flex;align-items:center;gap:10px;padding:6px 0;font-weight:800;font-size:15px;border-bottom:1px solid rgba(255,255,255,.07)}
.stats div:last-child{border:0}
.stats svg{width:22px;height:22px;flex:none}
.stats span{flex:1}.stats b{font-family:var(--disp);font-weight:400;font-size:18px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;max-height:52vh;overflow:auto}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.04);cursor:pointer;font-weight:800;font-size:13px}
.item .nm{font-family:var(--disp);font-weight:400;font-size:16px}
.item .ds{opacity:.75;font-size:11px;margin:2px 0 6px}
.item .pr{color:var(--gold)}
.item.eq{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.item.no{opacity:.5}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:2px solid rgba(255,255,255,.6)}
.toggles{display:grid;gap:8px;margin:12px 0}
.toggles label{display:flex;justify-content:space-between;align-items:center;font-weight:900;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
.toggles input{width:22px;height:22px;accent-color:#2fbf4f}
.tok{display:inline-flex;align-items:center;gap:4px;font-family:var(--disp);color:#9ff2ff}
.tok svg{width:18px;height:18px}
#dbg{position:fixed;right:8px;bottom:8px;z-index:20;background:rgba(0,0,0,.7);padding:8px;border-radius:10px;font:11px/1.4 monospace;max-width:260px}
#dbg button{font:11px monospace;margin:2px;padding:4px 6px;border-radius:6px;border:0;background:#2f74ff;color:#fff;cursor:pointer}
#fps{position:fixed;left:8px;bottom:8px;z-index:20;font:11px monospace;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:6px}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 0;display:flex;gap:6px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25);color:#fff}
.ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}.ico svg{width:100%;height:100%}
#hL{padding:4px 8px;font-family:var(--disp);font-size:13px;line-height:1.25;min-width:84px}#hL b{font-weight:400}#hArmy small{font-size:.75em;opacity:.7}#hArmy.full{color:#ffd23a}
#hC{padding:4px 10px;text-align:center;min-width:96px;flex:0 1 150px}#hC .gold{font-family:var(--disp);font-size:18px}#hC .gold b{font-weight:400}#hC small{display:block;font-size:8px;font-weight:900;letter-spacing:.06em;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hC .prog{height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin:3px 0 2px;overflow:hidden}#hC .prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc4ff,#ffd23a)}#hC.boss .prog span{background:linear-gradient(90deg,#ff6a4a,#d6281f)}
#hR{display:flex;gap:5px;align-items:flex-start;pointer-events:auto}#hR .dia{padding:6px 8px;font-family:var(--disp);font-size:14px;line-height:20px}#hR .dia b{font-weight:400}
.hb{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);font-family:var(--disp);font-size:13px;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.hb svg{width:20px;height:20px}#speedBtn.fast{background:linear-gradient(#ffb02e,#e07a12);border-color:#ffd27a}#autoBtn{font-size:10px;width:40px}#autoBtn.on{background:linear-gradient(#4cff8a,#1f9f4f);color:#082a14;border-color:#c8ffd8}
#drawer{position:fixed;left:0;top:calc(env(safe-area-inset-top) + 92px);z-index:6;display:flex;align-items:flex-start;transition:transform .22s ease;pointer-events:auto;touch-action:pan-y}
#drawer.away{transform:translateX(calc(-100% + 22px))}#classes{display:flex;flex-direction:column;gap:5px;padding:0 0 0 6px}
#drawerTab{width:22px;height:46px;margin-left:3px;border-radius:0 10px 10px 0;background:var(--panel);border:1px solid var(--line);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:18px;cursor:pointer}
.cl{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);user-select:none;-webkit-user-select:none}
.cl svg{width:30px;height:30px;flex:none}.cl .tx{display:none;flex-direction:column;line-height:1.05;min-width:62px}.cl .tx b{font-family:var(--disp);font-weight:400;font-size:12px}.cl .tx i{font-style:normal;font-size:9px;font-weight:900;opacity:.85}
#drawer.wide .cl .tx{display:flex}.cl.on{background:linear-gradient(#3f86ff,#1f4fbf);border:2px solid #fff}.cl .lv{position:absolute;left:2px;bottom:1px;font-size:8px;font-weight:900;opacity:.9}
.cl .ub{position:absolute;right:-12px;top:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#4a4f5c;border:1px solid #8a90a0;color:#d8dce6;font-size:9px;font-weight:900;line-height:18px;text-align:center;text-decoration:none}
.cl .ub.can{background:linear-gradient(#ffe06a,#f29a10);border-color:#fff3b0;color:#2a1a00;animation:ubp 1s ease-in-out infinite}@keyframes ubp{50%{transform:scale(1.1)}}
.cl .ch{position:absolute;right:-12px;bottom:-6px;width:20px;height:20px;border-radius:10px;background:#1b2a4a;border:1px solid #8aa0c8;color:#cfe2ff;font-style:normal;font-size:11px;line-height:18px;text-align:center}.cl .ch.on{background:linear-gradient(#ff6a4a,#d6281f);color:#fff}
#rightCol{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 92px);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
#powers{display:flex;flex-direction:column;gap:6px}.rb{position:relative;width:50px;height:50px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);user-select:none;-webkit-user-select:none}
.rb svg{width:26px;height:26px}.rb small{line-height:1;margin-top:1px;font-size:8px;font-weight:900;opacity:.9}.rb.ready{background:linear-gradient(#7a5cff,#3a22b8);border-color:#d8ceff}.rb.can{background:linear-gradient(#ffe06a,#f29a10);color:#2a1a00}.rb.cd{opacity:.5}
#energy{position:fixed;right:8px;width:50px;height:6px;border-radius:3px;background:rgba(0,0,0,.4);z-index:6;top:calc(env(safe-area-inset-top) + 84px);overflow:hidden}#energy b{display:block;height:100%;width:0;background:linear-gradient(90deg,#9f7aff,#5fe0ff)}
#choice{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 100px);z-index:7;text-align:center;pointer-events:auto}#choice .ct{font-family:var(--disp);font-size:13px;color:#ffd23a;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#choice .co{display:flex;gap:5px;margin-top:3px}#choice button{border:1px solid #fff3b0;border-radius:10px;background:linear-gradient(#ffe06a,#f29a10);color:#2a1a00;font-family:var(--disp);font-size:11px;padding:5px 7px;line-height:1.1;cursor:pointer;max-width:96px}#choice button small{display:block;font-family:Nunito,sans-serif;font-weight:900;font-size:9px}
#bossBar{position:fixed;z-index:6;width:150px;margin-left:-75px;text-align:center;pointer-events:none}#bossBar .bn{font-family:var(--disp);font-size:13px;color:#fff;text-shadow:0 2px 0 #000}#bossBar .bb{height:8px;border-radius:4px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);overflow:hidden}#bossBar .bb b{display:block;height:100%;background:linear-gradient(90deg,#ff6a4a,#d6281f)}#bossBar .bh{font-size:9px;font-weight:900;color:#fff;text-shadow:0 1px 0 #000}
@media (max-width:390px){#hL{font-size:12px;min-width:76px}#hC{min-width:84px}#hC .gold{font-size:16px}.hb{width:31px;height:31px}#autoBtn{width:36px}#hR .dia{padding:5px 6px;font-size:12px}}
#shop .tabs{display:flex;gap:6px;margin:8px 0}#shop .tabs button{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#fff;font-family:var(--disp);font-size:13px;padding:7px 0;cursor:pointer}#shop .tabs button.on{background:linear-gradient(#ffd23a,#f2a10c);color:#2a1a00}
#shop .item .bt{display:flex;gap:5px;margin-top:5px}#shop .item .bt button{flex:1;border-radius:8px;border:1px solid var(--line);background:#24365e;color:#fff;font-size:10px;font-weight:900;padding:4px 0;cursor:pointer}#shop .item .bt button[disabled]{opacity:.35}
.titleRec{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;font-weight:900;opacity:.9}.titleRec b{font-family:var(--disp);font-size:16px;font-weight:400;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud" class="hidden">
  <div id="hL" class="pnl"><div><i class="ico" id="icT"></i><b id="hTime">0:00</b></div><div><i class="ico" id="icA"></i><b id="hArmy">0</b></div><div><i class="ico" id="icW"></i><b id="hWave">WAVE 1</b></div></div>
  <div id="hC" class="pnl"><div class="gold"><i class="ico" id="icG"></i><b id="hCoins">0</b></div><div class="prog"><span id="hProg"></span></div><small id="hSector">OPENING</small></div>
  <div id="hR"><div class="pnl dia"><i class="ico" id="icD"></i><b id="hDia">0</b></div><div id="pauseBtn" class="hb" role="button" aria-label="Settings and pause"></div><div id="speedBtn" class="hb" role="button" aria-label="Game speed">1×</div><div id="autoBtn" class="hb on" role="button" aria-label="Auto or tap">AUTO</div></div>
</div>
<div id="drawer" class="hidden" aria-label="Soldier classes"><div id="classes"></div><div id="drawerTab" role="button" aria-label="Show or hide the class drawer">‹</div></div>
<div id="rightCol" class="hidden"><div id="powers"></div><div id="tankBtn" class="rb" role="button" aria-label="Tank upgrade"><i class="ico" id="icTank"></i><small id="tankCost"></small></div></div>
<div id="energy" class="hidden"><b id="enFill"></b></div>
<div id="choice" class="hidden"><div class="ct" id="choiceT"></div><div class="co" id="choiceO"></div></div>
<div id="bossBar" class="hidden"><div class="bn" id="bossName"></div><div class="bb"><b id="bossFill"></b></div><div class="bh" id="bossHp"></div></div>
<div id="postureBtn" class="hidden" role="button" aria-label="Toggle attack or defend"><span id="postureTxt">ATTACK</span><small id="postureSub">TAP TO DEFEND</small></div>
<div id="hpbar" class="hidden"><b id="hpFill"></b></div>
<div id="tip" class="hidden"><div class="hand" id="tipHand"></div><div class="big" id="tipBig">DRAG TO MOVE</div><div class="sm" id="tipSm">SOLDIERS DEPLOY AUTOMATICALLY</div></div>
<div id="banner"></div>

<div id="intro" class="hidden" role="button" aria-label="Skip intro"><div class="il" id="introLine"></div></div>
<div id="title" class="screen hidden"><div class="panel">
  <button class="btn sec sq" id="setBtn1" aria-label="Settings" style="position:absolute;top:12px;right:12px;width:40px;height:40px;padding:0"></button>
  <h1 class="disp">KMOB</h1><h2 class="disp">ENDLESS WAR</h2>
  <div class="best" id="titleBest"></div>
  <button class="btn" id="playBtn">PLAY</button>
  <button class="btn sec hidden" id="contBtn" style="margin-top:10px">CONTINUE<small id="contInfo" style="display:block;font-size:11px;opacity:.75"></small></button>
  <button class="btn sec" id="shopBtn1" style="margin-top:10px">SHOP</button>
  <a href="/games/" style="display:block;text-align:center;margin-top:14px;color:#9fc4ff;font-weight:900;font-size:13px;text-decoration:none">← KEEPITIL GAMES</a>
</div></div>

<div id="over" class="screen hidden"><div class="panel">
  <div class="sv">REACHED</div><div class="tm" id="oTime">WAVE 1</div><div class="pb" id="oPb"></div>
  <div class="stats" id="oStats"></div>
  <div class="row"><button class="btn sec sq" id="homeBtn" aria-label="Home"></button><button class="btn" id="againBtn">TRY AGAIN</button><button class="btn sec sq" id="shopBtn2" aria-label="Shop"></button></div>
  <button class="btn sec hidden" id="reviveBtn" style="margin-top:10px;font-size:16px">REVIVE (ONCE)</button>
</div></div>

<div id="pause" class="screen hidden"><div class="panel">
  <h2 class="disp" style="text-align:center;margin:0 0 6px;font-size:34px">PAUSED</h2>
  <div class="toggles" id="pToggles"></div>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn sec" id="menuBtn" style="margin-top:10px">SAVE &amp; MENU</button>
  <button class="btn sec" id="quitBtn" style="margin-top:10px">END RUN</button>
</div></div>
