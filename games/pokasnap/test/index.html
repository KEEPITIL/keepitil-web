<script>
/* Boot instrumentation + watchdog (plain script: runs before any module). */
(function(){var t0=Date.now(),b=window.__boot={t0:t0,marks:[],errors:[]};
window.__mark=function(n){var ms=Date.now()-t0;b.marks.push([n,ms]);try{console.log('[boot] '+n+' +'+ms+'ms')}catch(e){}};
__mark('html');
window.addEventListener('error',function(e){var u=e.target&&e.target.src;if(u&&u.indexOf(location.origin)!==0&&!/^(capacitor|file):/.test(u))return;/* optional third-party media (music artwork) has its own fallback; not a boot error */b.errors.push((e.message||'error')+' @ '+(e.filename||(e.target&&e.target.src)||'?')+':'+(e.lineno||0));try{console.error('[boot] error',b.errors[b.errors.length-1])}catch(x){}},true);
setTimeout(function(){if(!b.rendered){__mark('watchdog-8s');var s=document.getElementById('boot-msg');if(s)s.innerHTML='Still waking up… <button onclick="location.reload()" style="font:inherit;border:0;border-radius:99px;padding:8px 16px;background:#ff6b8b;color:#fff;margin-top:10px">Try again</button>'}},8000);})();
</script>
