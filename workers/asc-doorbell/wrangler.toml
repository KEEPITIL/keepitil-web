# No secrets in this file. Set them with `wrangler secret put` (see README).
name = "asc-doorbell"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["0 * * * *"]

# Create with: wrangler kv namespace create DOORBELL_KV  → paste the id here.
[[kv_namespaces]]
binding = "DOORBELL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
NEXUS_URL = "https://dojmswwxmdtizrtoirem.supabase.co"
# Crew room to post into (crew_rooms.id).
CREW_ROOM_ID = "e6e14afa-d901-4721-8535-4ff67f5190d0"
# KAI TARAKO bundle id is a PLACEHOLDER pending Joe's confirmation (and an App Store Connect record).
# Until the record exists, ASC returns no app for it and the doorbell skips it.
APPS = '''[
  {"name":"TUITEA","bundleId":"com.keepitil.thrive"},
  {"name":"KMOB","bundleId":"com.keepitil.kmob"},
  {"name":"KEEPITIL","bundleId":"com.keepitil.app"},
  {"name":"KAI TARAKO","bundleId":"com.keepitil.kaitarako","placeholder":true}
]'''
