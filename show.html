/* M2 simple event page. Everyone: details, lineup, tickets (to /event to buy). Ticket holder: "You have a ticket".
   Host: host tools. Password-protected events show no details here. Read only. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#0a0a0f);color:var(--text,#fff);font-family:var(--font,Inter,sans-serif);line-height:1.5;padding:0 0 48px}
.m2{max-width:760px;margin:0 auto;padding:0 16px}
.m2-loading,.m2-empty{color:var(--muted,#9aa);padding:40px 0;text-align:center}
.m2-cover{aspect-ratio:16/9;margin:0 -16px 14px;background:#0a0a12 center/cover no-repeat}
.m2-head{margin:18px 0 12px}
.m2-head:first-child{margin-top:28px}
.m2-badge{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line,#2a2a38);color:var(--muted,#9aa);margin:0 6px 8px 0}
.m2-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;line-height:1;letter-spacing:.02em}
.m2-tag{font-weight:600;margin-top:4px}
.m2-when{font-weight:800;color:var(--brand-2,#22e39b);margin-top:8px}
.m2-where{color:var(--muted,#9aa)}
.m2-host{display:inline-block;margin-top:6px;color:var(--brand,#00b4ff);font-weight:700;text-decoration:none}
.m2-genres{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.m2-chip{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;border:1px solid var(--line,#2a2a38);font-size:.78rem;font-weight:700}
.m2-link{border:1.5px solid var(--brand,#00b4ff);color:var(--brand,#00b4ff);text-decoration:none;padding:8px 14px;font-size:.86rem}
.m2-chips{display:flex;flex-wrap:wrap;gap:8px}
.m2-mine{display:block;margin:6px 0 12px;padding:12px 16px;border-radius:12px;background:rgba(34,227,155,.12);border:1px solid rgba(34,227,155,.45);color:var(--brand-2,#22e39b);font-weight:800;text-decoration:none}
.m2-sec{background:var(--surface,#15151f);border:1px solid var(--line,#2a2a38);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.m2-sec h2{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-2,#22e39b);margin-bottom:10px}
.m2-about{white-space:pre-line}
.m2-lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.m2-artist{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;min-width:0}
.m2-av{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:#0a0a12 center/cover no-repeat;border:1.5px solid var(--brand,#00b4ff)}
.m2-av-0{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--brand,#00b4ff)}
.m2-tiers{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.m2-tier{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line,#2a2a38);border-radius:10px}
.m2-tier-n{font-weight:800}.m2-tier-p{font-weight:800;color:var(--brand-2,#22e39b)}
.m2-tier-s,.m2-tier-d{grid-column:1/-1;font-size:.8rem;color:var(--muted,#9aa)}
.m2-off{opacity:.6}
.m2-cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border-radius:999px;background:var(--brand,#00b4ff);color:#001018;font-weight:900;text-decoration:none;letter-spacing:.02em}
.m2-status{color:var(--muted,#9aa);margin-bottom:10px}
.m2-share{margin-top:12px;background:transparent;border:1.5px solid var(--brand,#00b4ff);color:var(--brand,#00b4ff);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}
.m2-private{text-align:center;padding:60px 0}.m2-private p{color:var(--muted,#9aa);margin:8px 0 18px}
</style>
