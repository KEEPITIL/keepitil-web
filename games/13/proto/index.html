<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>Thirteen Anchors: Ashgrove prototype</title>
<style>
:root{--bg:#050505;--ink:#e9e4d4;--mute:#8d887a;--accent:#c9b87a;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 Georgia,'Times New Roman',serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#000d;z-index:5}
.card{max-width:440px;width:100%;background:#0e0d0b;border:1px solid #3a352a;padding:22px;text-align:center}
h1{margin:0 0 6px;font-weight:400;letter-spacing:.3em;font-size:1.6rem}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 12px}
.film p{margin:8px 0;text-align:left;font-size:.95rem}.film b{color:var(--accent);font-weight:400;letter-spacing:.1em;font-size:.8rem}
button{font:inherit;color:inherit;background:#1b1912;border:1px solid #4a4333;padding:11px 14px;cursor:pointer;min-height:44px}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card button{display:block;width:100%;margin-top:10px}
#hud{position:fixed;left:0;right:0;top:0;padding:8px 10px;pointer-events:none;z-index:2;display:flex;flex-direction:column;gap:6px}
#obj{font-size:.9rem;color:var(--accent);text-shadow:0 1px 3px #000}
#team{display:flex;gap:6px}
.sib{flex:0 0 auto;border:1px solid #3a352a;background:#000a;padding:3px 8px;font-size:.75rem;pointer-events:auto;min-height:36px}
.sib.on{border-color:var(--accent)}
.sib i{display:block;height:3px;background:#555;margin-top:3px}.sib i b{display:block;height:100%}
#stam{height:3px;width:90px;background:#222}#stam b{display:block;height:100%;background:#9aa;width:100%}
#sub{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);max-width:min(560px,92vw);text-align:center;font-size:.95rem;text-shadow:0 1px 4px #000;z-index:2;pointer-events:none;min-height:1.4em}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);color:var(--accent);font-size:.85rem;z-index:2;pointer-events:none;text-shadow:0 1px 3px #000}
#pad{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,64px);gap:6px;z-index:3}
#pad button{height:56px;padding:0;background:#14130fcc;font-size:.72rem}
#pad .big{grid-column:span 1}
#kp{position:fixed;inset:0;z-index:6;background:#000d;display:flex;align-items:center;justify-content:center}
#kp .card{max-width:260px}
#kpd{font:700 2rem monospace;letter-spacing:.4em;min-height:2.6rem;border:1px solid #4a4333;margin:8px 0}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
</style>
</head>
<body>
<canvas id="c" aria-label="Top-down view of the Ashgrove wing. Move with WASD or arrow keys, or the on-screen stick."></canvas>
<div id="hud" class="hidden"><div id="obj"></div><div id="team"></div><div id="stam"><b id="stamB"></b></div></div>
<div id="sub" aria-live="polite"></div><div id="toast" aria-live="polite"></div>
<div id="pad" class="hidden">
  <button id="bAct" aria-label="Interact">ACT</button><button id="bPow" aria-label="Use power">POWER</button><button id="bSwap" aria-label="Switch sibling">SWAP</button>
  <button id="bRun" aria-label="Hold to run">RUN</button><button id="bCrouch" aria-label="Crouch">CROUCH</button><button id="bLight" aria-label="Flashlight">LIGHT</button>
</div>
<div id="menu" class="overlay">
  <div class="card film" id="film">
    <h1>THIRTEEN</h1>
    <p class="sub">Prologue &middot; The Ashgrove Wing &middot; playable prototype</p>
    <div id="lines"></div>
    <button id="begin" disabled>Begin</button>
    <button id="cont" class="hidden">Continue from checkpoint</button>
    <p class="sub">WASD / arrows move &middot; Shift run &middot; C crouch &middot; E interact &middot; Space power &middot; Tab or 1-2-3 switch &middot; F light &middot; Esc pause<br>Touch: drag the left half to move, buttons at right. No network, no tracking; progress stays on this device.</p>
  </div>
</div>
<div id="end" class="overlay hidden"><div class="card" id="endBody"></div></div>
<div id="kp" class="hidden"><div class="card"><h1 style="font-size:1rem">EXIT LOCK</h1><div id="kpd" aria-live="polite"></div><div id="keys"></div><button id="kpx">Close</button></div></div>

<script>
//LOGIC-BEGIN
// ---- verbatim from games/13/js/data.js and games/13/js/director.js ----
/* THE THIRTEEN ANCHORS — static data: siblings, the 13-case schema, the prologue case. */
window.T13 = window.T13 || {};
T13.BUILD = 'Milestone C0 visual pass · build 2';

T13.SIBLINGS = [
  { id: 'mara', name: 'Mara', color: 0x9b7be0, css: '#9b7be0', domain: 'MIND', power: 'Resonance', powerHow: 'Sense the Hollow through walls and read the memory in a touched object. Near the Hollow, Influence turns it away.', cd: 14 },
  { id: 'gabriel', name: 'Gabriel', color: 0xd9534f, css: '#d9534f', domain: 'FORCE', power: 'Push', powerHow: 'A telekinetic push: shoves heavy objects and staggers the Hollow for a few seconds.', cd: 12 },
  { id: 'daniel', name: 'Daniel', color: 0x3fb6a8, css: '#3fb6a8', domain: 'REALITY', power: 'Unmask', powerHow: 'See what is really there: false walls, hidden writing, counterfeits.', cd: 10 },
];

/* Every case uses this schema. The four information categories are kept apart on purpose:
   history (documented, with sources) · reports (attributed paranormal claims) · lantern (what the characters believe) · fiction (our mythology).
   status: a real-location case cannot ship until research.verified === true. */
T13.CASE_SCHEMA = {
  id: 'string', number: 'int 1–13', title: 'string', location: 'string', anchor: 'Pride|Greed|Lust|Envy|Gluttony|Wrath|Sloth|Fear|Grief|Guilt|Betrayal|Despair|—',
  research: { verified: 'bool', history: '[{claim, source}]', reports: '[{claim, attributedTo, firstReported, source}]', ethics: 'string', rejectedReason: 'string|null' },
  lantern: 'string', fiction: 'string',
  films: { case: '{id, lines[], mandatorySeconds, clues[]}', family: '{id, lines[]}' },
  clues: '[{id, cinematic, environmental, failsafeAfterAttempts, failsafe}]',
  loop: 'ENTER → EXPLORE → INVESTIGATE → PROVOKE → SURVIVE → RESOLVE → ESCAPE (objective ids per stage)',
  eliasBreadcrumb: 'string', reward: '{xp, skill, theaterUnlocks[]}',
};

/* Candidate list from the directive — NONE approved yet. Each must pass the research checklist before production. */
T13.CANDIDATES = ['Bhuj, India', 'Baguio, Philippines', 'Penang, Malaysia', 'Changi, Singapore', 'Port Arthur, Australia', 'Tuol Sleng, Cambodia', 'Armero, Colombia', 'Aberfan, Wales', 'Saint-Pierre, Martinique', 'Galveston, Texas', 'Peshtigo, Wisconsin', 'Iroquois Theatre, Chicago', 'Halifax, Canada'];

T13.CASES = Array.from({ length: 13 }, (_, i) => ({ number: i + 1, title: `Case ${['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII'][i]}`, status: 'locked', note: 'Location under research — not yet approved.' }));

/* PROLOGUE — a FICTIONAL gray-box location used to prove the horror loop. It is not a real place and makes no historical claim. */
T13.PROLOGUE = {
  id: 'prologue', title: 'Prologue — The Ashgrove Wing', fictional: true,
  film: { mandatorySeconds: 6, lines: [
    ['', 'LANTERN TRAINING FILE · PROLOGUE\nA fictional location built for this prologue. No real tragedy is depicted.'],
    ['DANIEL', 'The Ashgrove wing was closed after the fire. On the original plan the wards were numbered four, one, three. Everything else got renumbered.'],
    ['MARA', 'Something is still in there. It doesn’t feel like a ghost. It feels like it’s… listening.'],
    ['GABRIEL', 'Then we don’t make noise. Power first, then we get out.'],
    ['DANIEL', 'One more thing. Every report says it only comes when the lights go out.'],
  ] },
  code: '413',
  objectives: {
    enter: 'Find the fuse box. The power is out.',
    fusebox: 'The fuse is missing. Search the wing.',
    blocked: 'A heavy cabinet blocks the east hall. (Gabriel can move it.)',
    fuse: 'The fuse is behind something that isn’t really a wall. (Daniel sees what’s real.)',
    hunt: 'It knows. Get the fuse back to the fuse box.',
    exit: 'Power is back. Open the exit door — it needs a code.',
    escape: 'Get out.',
  },
  breadcrumb: 'Scratched into the exit door, fresh: a lantern insignia — and three words. “DON’T FOLLOW ME.”',
};
/* FEAR DIRECTOR 2.0 — CALM → UNEASY → TENSION → DANGER → TERROR → RELEASE.
   Inputs (all optional): dark, dist (Hollow m), hunting, hidden, provoked, health (0 stable…2 critical), speed, zone,
   progress (0..1), hollowStage (DISTANT/NEAR/SAME_AREA/HUNT/IMMEDIATE), echoActive, separation (m), t.
   Output: state, intensity k, and at most one event per decision. Repetition is prevented per event AND per zone;
   sometimes it deliberately builds and delivers NOTHING (tracked as 'build') so later scares land harder. */
(function () {
  const STATES = ['CALM', 'UNEASY', 'TENSION', 'DANGER', 'TERROR', 'RELEASE'];
  const POOL = {
    CALM: [['creak', 3], ['step_far', 1], ['nothing', 5], ['build', 2]],
    UNEASY: [['creak', 2], ['step_far', 3], ['whisper', 2], ['door_far', 1], ['shadow', 1], ['object_fall', 1], ['build', 3], ['nothing', 2]],
    TENSION: [['step_near', 3], ['whisper', 3], ['door_slam', 2], ['flicker', 2], ['radio', 2], ['false_voice', 1], ['shadow', 2], ['blackout', 1], ['glass', 1], ['object_fall', 1], ['sibling_react', 2], ['build', 2]],
    DANGER: [['step_near', 3], ['flicker', 2], ['false_voice', 2], ['shadow', 2], ['radio', 1], ['silence', 2], ['blackout', 2], ['glass', 1], ['sibling_react', 1], ['build', 1]],
    TERROR: [['flicker', 2], ['whisper', 1], ['nothing', 1]],
    RELEASE: [['nothing', 1]],
  };
  const INTENSITY = { creak: 0.05, step_far: 0.08, whisper: 0.15, door_far: 0.12, shadow: 0.3, object_fall: 0.2, step_near: 0.25, door_slam: 0.3, flicker: 0.15, radio: 0.2, false_voice: 0.35, blackout: 0.45, glass: 0.3, sibling_react: 0.1, silence: 0.2, build: 0, nothing: 0 };
  const D = T13.director = { state: 'CALM', k: 0, log: [], events: [], last: null, next: 6, releaseUntil: 0, silenceUntil: 0, recent: 0, sinceMeaningful: 0, zoneHist: {}, builds: 0 };
  D.reset = () => { Object.assign(D, { state: 'CALM', k: 0, last: null, next: 6, releaseUntil: 0, silenceUntil: 0, recent: 0, sinceMeaningful: 0, zoneHist: {}, builds: 0, lastFired: null }); D.log = []; D.events = []; };
  D.bump = v => { D.k = Math.min(1, D.k + v); D.recent = Math.min(1, D.recent + v); D.sinceMeaningful = 0; };
  D.STATES = STATES; D.POOL = POOL;
  D.update = (dt, ctx, fire) => {
    const near = ctx.dist < 30 ? (30 - ctx.dist) / 30 : 0, stage = ctx.hollowStage || '';
    D.recent = Math.max(0, D.recent - dt * 0.03); D.sinceMeaningful += dt;
    let target = 0.08 + (ctx.dark ? 0.1 : 0) + near * 0.5 + (ctx.hunting ? 0.35 : 0) + (ctx.provoked ? 0.1 : 0)
      + (ctx.health || 0) * 0.07 + Math.min(0.15, (ctx.separation || 0) / 80) + (ctx.echoActive ? 0.06 : 0) + (ctx.progress || 0) * 0.08
      + (stage === 'SAME_AREA' ? 0.1 : stage === 'IMMEDIATE' ? 0.25 : 0) + Math.min(0.12, D.sinceMeaningful / 400);
    if (ctx.hidden) target *= 0.55;
    D.k += (Math.min(1, target) - D.k) * Math.min(1, dt * (target > D.k ? 0.5 : 0.18));
    const prev = D.state;
    if (ctx.t < D.releaseUntil) D.state = 'RELEASE';
    else D.state = ctx.hunting && near > 0.5 ? 'TERROR' : D.k > 0.62 ? 'DANGER' : D.k > 0.42 ? 'TENSION' : D.k > 0.22 ? 'UNEASY' : 'CALM';
    if (prev === 'TERROR' && D.state !== 'TERROR') { D.releaseUntil = ctx.t + 9; D.state = 'RELEASE'; }
    if (prev !== D.state) D.log.push(`${(ctx.t || 0).toFixed(1)} ${prev}→${D.state}`);
    D.next -= dt;
    if (D.next <= 0) {
      const zone = ctx.zone || '-', zh = D.zoneHist[zone] = D.zoneHist[zone] || [];
      // exclude: the last event anywhere, anything this zone produced in its last 3 events, and big scares when recent intensity is already high
      let pool = POOL[D.state].filter(e => e[0] !== D.last && e[0] !== D.lastFired && !zh.slice(-3).includes(e[0]) && !(D.recent > 0.6 && INTENSITY[e[0]] > 0.25));
      if (!pool.length) pool = POOL[D.state].filter(e => e[0] !== D.last && e[0] !== D.lastFired); if (!pool.length) pool = [['nothing', 1]];
      const tot = pool.reduce((a, e) => a + e[1], 0); let r = Math.random() * tot, pick = pool[0][0];
      for (const e of pool) { if ((r -= e[1]) <= 0) { pick = e[0]; break; } }
      D.last = pick; zh.push(pick); if (zh.length > 6) zh.shift();
      const base = { CALM: 14, UNEASY: 10, TENSION: 7, DANGER: 5, TERROR: 4, RELEASE: 12 }[D.state];
      D.next = base * (0.6 + Math.random() * 0.9) * (1 + D.recent * 0.8) * (ctx.speed > 3.5 ? 0.8 : 1);
      if (pick === 'build') { D.builds++; D.next *= 0.6; }   // anticipation: a quiet beat, then the next decision comes sooner
      D.events.push({ t: +(ctx.t || 0).toFixed(1), state: D.state, ev: pick, zone }); if (D.events.length > 300) D.events.shift();
      if (INTENSITY[pick]) { D.recent = Math.min(1, D.recent + INTENSITY[pick]); D.sinceMeaningful = 0; }
      if (pick !== 'nothing' && pick !== 'build') { D.lastFired = pick; fire(pick); }
    }
    return { state: D.state, k: D.k, silence: (ctx.t || 0) < D.silenceUntil };
  };
})();
// ---- the prologue rules: ports of games/13/js/level.js + game.js without three.js (top-down playable) ----
const T13P = (() => {
  const CASE = T13.PROLOGUE, SIBS = T13.SIBLINGS;
  const MAP = [
    '##########################',
    '#.......#.........#......#',
    '#..S....D.........D....M.#',
    '#.F.....#....L....#......#',
    '####D####.........########',
    '#.......####.#####.......#',
    '#.L.....#.........#......#',
    '#.......#.........C...H..#',
    '#.......#.........#....L.#',
    '#####D###.........####W###',
    '#.......#.........#......#',
    '#...L...#...L.....#....U.#',
    '#.......D.........#......#',
    '#.E.....#.........#......#',
    '##########################',
  ];
  const S = 3, W = MAP[0].length, R = MAP.length;
  const cellOf = (x, z) => [Math.floor(x / S), Math.floor(z / S)];
  const center = (c, r) => ({ x: c * S + S / 2, z: r * S + S / 2 });
  const find = ch => { const out = []; MAP.forEach((row, r) => [...row].forEach((k, c) => { if (k === ch) out.push({ c, r }); })); return out; };
  const K = (c, r) => c + ',' + r;
  const hyp = Math.hypot;
  const BREAKABLE = [[18, 11]];
  const MEMORIES = [
    { id: 'musicbox', c: 23, r: 2, text: 'I can hear her. A nurse, running, counting the wards out loud — four… one… three…' },
    { id: 'fusebox', c: 2, r: 3, text: 'Somebody pulled this fuse on purpose. A man in a long coat. He was… protecting us?' },
    { id: 'exit', c: 2, r: 13, text: 'Fresh. Someone scratched this door tonight. It hurt them to do it.' },
  ];
  const SPEED = { walk: 2.6, run: 4.4, crouch: 1.4 };
  const RADIUS = 0.35;

  function createWorld(opts) {
    opts = opts || {};
    const rng = opts.rng || Math.random;
    const sp = find('S')[0], p0 = center(sp.c, sp.r);
    const w = {
      rng, t: 0, stage: 'enter', flags: {}, doors: new Set(), blockedCells: new Set(), openCells: new Set(),
      cabinetMoved: false, falseGone: false, said: {}, sched: [], events: [], hollowOff: !!opts.hollowOff,
      sibs: SIBS.map((d, i) => ({ id: d.id, name: d.name, css: d.css, power: d.power, cd: d.cd, cdLeft: 0, x: p0.x + (i - 1) * 0.8, z: p0.z + 0.9, yaw: Math.PI })),
      active: 0, hidden: null, light: true, crouch: false, stamina: 1, keypad: false, codeTries: 0, over: null,
      resonanceUntil: 0, checkpoint: null, doorBump: 0, stats: { hides: 0, pushes: 0, caught: 0 },
      enemy: { x: 0, z: 0, state: 'dormant', path: null, pi: 0, t: 40, lastSeen: null, repath: 0, stag: 0, contact: -99, atkT: 0, wait: 0, sawHide: false, buff: 0, yaw: 0, stepT: 0 },
    };
    const hp = find('H')[0], h0 = center(hp.c, hp.r); w.enemy.x = h0.x; w.enemy.z = h0.z;
    const cp = opts.checkpoint;
    if (cp) {
      Object.assign(w.flags, cp.flags); w.stage = cp.stage;
      w.sibs.forEach((b, i) => { b.x = cp.x + (i - 1) * 0.7; b.z = cp.z + (i ? 0.8 : 0); });
      if (w.flags.cabinetMoved) w.cabinetMoved = true; if (w.flags.falseGone) w.falseGone = true;
      if (w.flags.gated) { w.blockedCells.add(K(18, 7)); w.openCells.add(K(18, 11)); }
      if (w.flags.fuseTaken) { w.enemy.state = 'patrol'; w.enemy.t = 2; placeEnemyAway(w, 24); w.enemy.contact = 8; wander(w); }
    }
    return w;
  }

  // ---- grid (ports of L.blocked / L.opaque / L.los / L.path) ----
  function blocked(w, c, r, forEnemy) {
    if (r < 0 || c < 0 || r >= R || c >= W) return true;
    const hk = K(c, r); if (w.blockedCells.has(hk)) return true; if (w.openCells.has(hk)) return false;
    const k = MAP[r][c];
    if (k === '#' || k === 'L' || k === 'F' || k === 'E') return true;
    if (k === 'C') return !w.cabinetMoved;
    if (k === 'W') return !w.falseGone;
    if (k === 'D') return forEnemy ? false : !w.doors.has(hk);
    return false;
  }
  function opaque(w, c, r) {
    if (r < 0 || c < 0 || r >= R || c >= W) return true;
    const hk = K(c, r); if (w.openCells.has(hk)) return false;
    if (w.blockedCells.has(hk)) return true;
    const k = MAP[r][c];
    if (k === '#' || k === 'E' || k === 'F') return true;
    if (k === 'C') return !w.cabinetMoved;
    if (k === 'W') return !w.falseGone;
    if (k === 'D') return !w.doors.has(hk);
    return false;
  }
  function los(w, x0, z0, x1, z1) {
    const n = Math.ceil(hyp(x1 - x0, z1 - z0) / 0.5);
    for (let i = 1; i < n; i++) { const t = i / n, [c, r] = cellOf(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t); if (opaque(w, c, r)) return false; }
    return true;
  }
  function path(w, from, to) {
    const key = (c, r) => r * W + c, prev = new Map([[key(from[0], from[1]), null]]), q = [from];
    while (q.length) {
      const [c, r] = q.shift(); if (c === to[0] && r === to[1]) break;
      for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nc = c + dc, nr = r + dr, k = key(nc, nr);
        if (prev.has(k) || blocked(w, nc, nr, true)) continue; prev.set(k, [c, r]); q.push([nc, nr]);
      }
    }
    if (!prev.has(key(to[0], to[1]))) return null;
    const out = []; let cur = to; while (cur) { out.unshift(cur); cur = prev.get(key(cur[0], cur[1])); } return out;
  }
  function floorCells(w) { const o = []; MAP.forEach((row, r) => [...row].forEach((k, c) => { if (!blocked(w, c, r, true) && k !== 'D') o.push([c, r]); })); return o; }
  const near2 = (a, c, r, d) => { const p = center(c, r); return hyp(p.x - a.x, p.z - a.z) < d; };
  const cur = w => w.sibs[w.active];
  const say = (w, who, text) => w.events.push({ type: 'say', who, text });
  const toast = (w, text) => w.events.push({ type: 'toast', text });
  const later = (w, secs, fn) => w.sched.push({ at: w.t + secs, fn });

  // verbatim logic of game.js objectiveText (only `s.flags` renamed)
  function objectiveText(flags) { const O = CASE.objectives, f = flags; if (f.escaped) return ''; if (f.power) return O.exit; if (f.fuseTaken) return O.hunt; if (f.cabinetMoved) return O.fuse; if (f.cabinetSeen) return O.blocked; if (f.fuseboxSeen) return O.fusebox; return O.enter; }

  // ---- noise / Hollow (ports of G.noise, placeEnemyAway, goTo, wander, sees, updateEnemy) ----
  function noise(w, x, z, radius) {
    const e = w.enemy; if (['dormant', 'hunt', 'stagger', 'flee', 'grab'].includes(e.state)) return;
    if (hyp(e.x - x, e.z - z) < radius * (1 + e.buff)) goTo(w, x, z, 'investigate');
  }
  function placeEnemyAway(w, minD) {
    const a = cur(w), cells = floorCells(w).filter(([c, r]) => { const p = center(c, r); return hyp(p.x - a.x, p.z - a.z) > minD && !los(w, a.x, a.z, p.x, p.z); });
    const [c, r] = cells[Math.floor(w.rng() * cells.length)] || [22, 7]; const p = center(c, r); w.enemy.x = p.x; w.enemy.z = p.z;
  }
  function goTo(w, x, z, state) { const e = w.enemy, p = path(w, cellOf(e.x, e.z), cellOf(x, z)); if (!p) return false; e.path = p; e.pi = 1; e.state = state; return true; }
  function wander(w) { const cells = floorCells(w), pick = cells[Math.floor(w.rng() * cells.length)], p = center(pick[0], pick[1]); goTo(w, p.x, p.z, 'patrol'); }

    const v = g.createRadialGradient(Wd / 2, Hd / 2, Math.min(Wd, Hd) * 0.25, Wd / 2, Hd / 2, Math.max(Wd, Hd) * 0.7); v.addColorStop(0, '#0000'); v.addColorStop(1, '#000c'); g.fillStyle = v; g.fillRect(0, 0, Wd, Hd);
    if (hurt > 0 || w.enemy.state === 'hunt') { g.fillStyle = 'rgba(160,0,0,' + (0.12 + 0.12 * Math.sin(w.t * 9) + hurt * 0.25) + ')'; g.fillRect(0, 0, Wd, Hd); }

  }
  function drawEnemy(poly, res) {

    g.globalAlpha = res ? 0.55 : 1; g.fillStyle = res ? '#9b7be0' : '#050505'; g.beginPath(); g.ellipse(sx, sy, 0.6 * Z, 0.75 * Z, 0, 0, 7); g.fill();

  }

  // ---- input ----
  addEventListener('keydown', ev => {

    if (w.keypad) { if (k >= '0' && k <= '9') keyIn(k); else if (k === 'backspace') keyIn('⌫'); else if (k === 'enter') keyIn('OK'); else if (k === 'escape') closeKeypad(); ev.preventDefault(); return; }

    if (mode !== 'play') return;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'tab'].includes(k)) ev.preventDefault();
    if (ev.repeat) { keys[k] = true; return; }
    keys[k] = true;
    if (k === 'e') { P.interact(w); hud(); }
    else if (k === ' ') { P.usePower(w); hud(); }
    else if (k === 'tab') { P.switchTo(w, (w.active + 1) % 3); hud(); }
    else if (k === '1' || k === '2' || k === '3') { P.switchTo(w, +k - 1); hud(); }
    else if (k === 'f') P.toggleLight(w);
  });
  addEventListener('keyup', ev => { keys[ev.key.toLowerCase()] = false; });
  cvs.addEventListener('pointerdown', ev => { if (mode !== 'play' || ev.clientX > Wd * 0.6 || stick.id !== null) return; stick.id = ev.pointerId; stick.x0 = ev.clientX; stick.y0 = ev.clientY; stick.mx = stick.mz = 0; try { cvs.setPointerCapture(ev.pointerId); } catch (e) {} });

  cvs.addEventListener('pointerup', endStick); cvs.addEventListener('pointercancel', endStick);
  $('bAct').onclick = () => { if (w && mode === 'play') { P.interact(w); hud(); } };
