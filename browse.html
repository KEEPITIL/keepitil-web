<style>
/* M3 event discovery. Upcoming published events, city and genre filters, each card opens /show. Read only. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#0a0a0f);color:var(--text,#fff);font-family:var(--font,Inter,sans-serif);line-height:1.5;padding:22px 0 48px}
.m3{max-width:900px;margin:0 auto;padding:0 16px}
.m3-h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;line-height:1;letter-spacing:.02em;margin:6px 0 14px}
.m3-loading,.m3-empty{color:var(--muted,#9aa);padding:30px 0;text-align:center}
.m3-filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.m3-filters label{display:flex;flex-direction:column;gap:4px;flex:1 1 150px}
.m3-filters span{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-2,#22e39b)}
.m3-filters select{appearance:none;background:var(--surface,#15151f);color:inherit;border:1px solid var(--line,#2a2a38);border-radius:12px;padding:10px 12px;font:inherit;font-weight:700}
.m3-count{color:var(--muted,#9aa);font-size:.82rem;margin-bottom:10px}
.m3-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.m3-card{background:var(--surface,#15151f);border:1px solid var(--line,#2a2a38);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.m3-cover{display:block;aspect-ratio:16/9;background:#0a0a12 center/cover no-repeat}
.m3-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.m3-when{font-weight:800;color:var(--brand-2,#22e39b);font-size:.86rem}
.m3-title{font-size:1.15rem;line-height:1.2;font-weight:800}.m3-title a{color:inherit;text-decoration:none}
.m3-where{color:var(--muted,#9aa);font-size:.86rem}
.m3-chips{display:flex;flex-wrap:wrap;gap:6px}
.m3-genres{font-size:.76rem;color:var(--muted,#9aa)}
.m3-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line,#2a2a38);font-size:.78rem;font-weight:700;color:inherit;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m3-host{border-color:var(--brand,#00b4ff);color:var(--brand,#00b4ff)}

.m3-price{font-weight:800;margin-top:2px}
</style>
</head>
<body>
<nav id="main-nav" aria-label="KEEPITIL platform"><div class="nav-inner">

</div></nav>

<main class="m3"><h1 class="m3-h1">Upcoming events</h1><div id="m3root" class="m3-loading">Loading events…</div></main>

<script>
var SUPA_URL='https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
var supa=window.supabase?supabase.createClient(SUPA_URL,SUPA_KEY):null;
(function(){
  var root=document.getElementById('m3root');
  if(!supa||!window.KilBrowse){ root.textContent='Events could not load. Check your connection and try again.'; return; }
  var q=new URLSearchParams(location.search);
  KilBrowse.mount(root,supa,{city:q.get('city')||'',genre:q.get('genre')||''}).then(function(){
    root.classList.remove('m3-loading');
  }).catch(function(){ root.textContent='Events could not load. Check your connection and try again.'; });
})();
</script>
