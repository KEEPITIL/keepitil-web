<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="The Thirteen Anchors — Season One. A supernatural horror game presented by KEEPITIL, developed by TUITEA.">
<title>The Thirteen Anchors</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/game.css?v=3">
</head>
<body>
<canvas id="view"></canvas>

<!-- boot -->
<div id="boot" class="layer">
  <div class="bt" id="bt1"><small>PRESENTED BY</small><b>KEEPITIL</b></div>
  <div class="bt" id="bt2"><small>DEVELOPED BY</small><b>TUITEA</b></div>
  <div class="bt title" id="bt3"><b data-t="THE THIRTEEN ANCHORS">THE THIRTEEN ANCHORS</b><small>SEASON ONE</small></div>
  <button id="tapstart" class="ghost">Tap to begin — sound on 🎧</button>
</div>

<!-- Lantern HQ: a 3D room (js/hq.js); this layer only carries the object tags and the back control -->
<div id="hq" class="layer hidden"><button id="hqBack" class="hq-back hidden">‹ BACK</button><div class="hq-build" id="hqbuild"></div></div>

<!-- generic panel -->
<div id="panel" class="layer hidden"><div class="pbox"><button class="pclose" aria-label="Close">✕</button><div id="pbody"></div></div></div>
<div id="theater" class="hidden"><div id="theaterBody"></div></div>

<!-- cinematic -->
<div id="cine" class="layer hidden"><div class="cine-frame"><div id="cineText"></div></div><div class="cine-bar"><span id="cineWho"></span><button id="cineSkip" class="ghost hidden">SKIP ▸▸</button></div></div>

<!-- in-game HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div id="team"></div>
    <div id="obj"></div>
    <button id="pauseBtn" class="round" aria-label="Pause">❚❚</button>
  </div>
  <div id="sub"></div>
  <div id="prompt"></div>
  <div id="fearbar"><i></i></div>
  <div id="ability-cd"></div>
  <div id="stick"><i></i></div>
  <div id="touchBtns">
    <button data-k="switch" class="tb sw">⇄</button>
    <button data-k="ability" class="tb ab">✦</button>
    <button data-k="interact" class="tb in">✋</button>
    <button data-k="run" class="tb rn">RUN</button>
    <button data-k="crouch" class="tb cr">⤓</button>
    <button data-k="light" class="tb lt">🔦</button>
  </div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="keyhelp">WASD move · Mouse look · E interact · Shift run · C crouch · F flashlight · Q power · Tab / 1-2-3 switch · Esc pause</div>
</div>

<!-- keypad -->
<div id="keypad" class="layer hidden"><div class="pbox kp"><div id="kpShow">_ _ _</div><div class="kpgrid"></div><div id="kpMsg"></div><button class="pclose" aria-label="Close">✕</button></div></div>

<!-- death / end -->
<div id="over" class="layer hidden"><div class="obox"><h1 id="overT"></h1><p id="overP"></p><button id="overBtn" class="big">Try again</button><button id="overHQ" class="ghost">Back to Lantern HQ</button></div></div>

<script type="importmap">{"imports":{"three":"./vendor/jsm/three-shim.js"}}</script>
<script src="vendor/three.min.js"></script>
<script src="vendor/loaders/GLTFLoader.js"></script>
<script src="vendor/loaders/DRACOLoader.js"></script>
<script src="vendor/loaders/meshopt_decoder.js"></script>
<script src="vendor/loaders/SkeletonUtils.js"></script>
<script src="js/data.js?v=3"></script>
<script src="js/gfx.js?v=3"></script>
<script src="js/assets.js?v=3"></script>
<script src="js/people.js?v=3"></script>
<script src="js/people-glb.js?v=3"></script>
<script src="js/hollow.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/director.js?v=3"></script>
<script src="js/level.js?v=3"></script>
<script src="js/game.js?v=3"></script>
<script src="js/hq.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
</body>
</html>
