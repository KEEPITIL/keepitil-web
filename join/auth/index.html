<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>TUITEA email link</title>
<!--
  WHERE A TUITEA EMAIL LINK LANDS WHEN THE APP DID NOT CATCH IT.

  On an iPhone with TUITEA installed, iOS opens the APP for https://keepitil.com/join/*
  (apple-app-site-association) and this page is never seen. It exists for the other cases:
  the app is not installed, the link was opened on a computer, or a mail client forced it
  into a browser tab.

  BUILD 88 PHASE 2. This page used to assume every link was a password reset, and told a NEW
  member who had just confirmed their address to "choose Forgot password". A confirmation
  (sign-up, a new email address) is already done by the time Supabase sends the browser here —
  Supabase confirms first, then redirects — so the page now says so and offers sign-in.

  A PKCE ?code= still belongs to the app that asked for it; this page does not redeem it.
  "Your email is confirmed" is shown only after verifyOtp({ token_hash, type: 'signup' })
  succeeds. Any other confirmation link gets a clear error and a resend form.
  type=recovery is left untouched.
-->
<style>
  :root{--bg:#FBF7EF;--ink:#20261F;--muted:#6E7566;--ocean:#33777D;--line:#E2D9C6;--surface:#FFFDF8}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14170F;--ink:#ECE7DA;--muted:#9BA391;--ocean:#6FBFC5;--line:#333A2D;--surface:#1C201A}}
  :root[data-theme="dark"]{--bg:#14170F;--ink:#ECE7DA;--muted:#9BA391;--ocean:#6FBFC5;--line:#333A2D;--surface:#1C201A}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding:24px 16px}
  .card{max-width:34rem;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.4rem}
  h1{font-size:1.35rem;margin:0 0 .5rem}
  p{margin:0 0 .8rem;color:var(--muted)}
  a.btn{display:inline-block;background:var(--ocean);color:#fff;text-decoration:none;font-weight:600;padding:.7rem 1.1rem;border-radius:999px;margin:.2rem .2rem .2rem 0}
  a{color:var(--ocean)}
  .small{font-size:.9rem}
  label{display:block;font-size:.88rem;font-weight:600;margin:.4rem 0 .3rem;color:var(--ink)}
  input{width:100%;box-sizing:border-box;padding:.75rem .8rem;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
  button{margin-top:.7rem;width:100%;padding:.8rem;min-height:48px;border:0;border-radius:999px;background:var(--ocean);color:#fff;font-weight:600;font-size:1rem;cursor:pointer}
  button[disabled]{opacity:.5;cursor:default}
  #resend-msg{min-height:1.2em}
  .err{color:#B4472F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#E38B72}}
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Almost there</h1>
    <p id="msg">This link came from TUITEA. If TUITEA is installed on this iPhone, open the same link from the Mail app and it will open TUITEA directly.</p>
    <p>
      <a class="btn" id="signin" href="https://keepitil.com/app/tuitea/app/">Sign in to TUITEA on the web</a>
    </p>
    <p class="small" id="next">On iPhone, open TUITEA and sign in with your email and password.</p>
    <div id="resend" hidden>
      <p id="resend-note">Send a new confirmation link to your email.</p>
      <form id="resend-form">
        <label for="resend-email">Your email</label>
        <input id="resend-email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
        <button type="submit" id="resend-send">Email me a new confirmation link</button>
      </form>
      <p id="resend-msg" role="status"></p>
    </div>
  </div>
  <script type="module">
    import { confirmAction } from './confirm.mjs';

    const SUPABASE_URL = 'https://ovmqtzjfpzrbzrlkxwgw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bXF0empmcHpyYnpybGt4d2d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDM5OTEsImV4cCI6MjA5Njc3OTk5MX0.rqFG5illhiePFOnqkKaA7nVSv_LWtJ95HHW1NVIo6CQ';
    const REDIRECT = 'https://keepitil.com/join/auth?flow=confirm';

    const title = document.getElementById('title');
    const msg = document.getElementById('msg');
    const resend = document.getElementById('resend');

    function confirmed() {
      title.textContent = 'Your email is confirmed';
      msg.textContent = 'Thank you. You can sign in to TUITEA now with your email and password.';
      resend.hidden = true;
    }
    function needResend(text) {
      title.textContent = 'That link could not be used';
      msg.textContent = text;
      resend.hidden = false;
    }

    let client = null;
    async function supabase() {
      if (client) return client;
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.45.4');
      client = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
      return client;
    }

    document.getElementById('resend-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const out = document.getElementById('resend-msg');
      const btn = document.getElementById('resend-send');
      const email = document.getElementById('resend-email').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        out.className = 'err';
        out.textContent = "That doesn't look like an email address.";
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Sending…';
      let error = null;
      try {
        const sb = await supabase();
        const r = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: REDIRECT } });
        error = r.error;
      } catch (e) { error = e; }
      btn.textContent = 'Email me a new confirmation link';
      if (error) {
        btn.disabled = false;
        out.className = 'err';
        const code = (error.code || '') + '';
        out.textContent = (code === 'over_email_send_rate_limit' || error.status === 429)
          ? 'Too many emails have been requested just now. Please wait a few minutes, then try again.'
          : "We couldn't send the email just now. Check your connection and try again.";
        return;
      }
      out.className = '';
      out.textContent = 'Sent. If ' + email + ' has a TUITEA account waiting to be confirmed, a new email is on its way — check Spam or Junk too.';
      setTimeout(() => { btn.disabled = false; }, 60000);
    });

    try {
      const action = confirmAction(location.search, location.hash);
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      const err = h.get('error_description') || q.get('error_description') || h.get('error') || q.get('error');

      if (action === 'recovery-error') {
        const expired = /expired|invalid|already/i.test(decodeURIComponent(String(err).replace(/\+/g, ' ')));
        title.textContent = 'That link could not be used';
        msg.textContent = (expired ? 'That link has expired or was already used. ' : '') +
          'Nothing on your account has changed. Open TUITEA and tap Forgot Password to get a new one.';
      } else if (action === 'verify-signup') {
        title.textContent = 'Checking your link…';
        msg.textContent = '';
        const token = q.get('token_hash') || h.get('token_hash');
        const sb = await supabase();
        const { error } = await sb.auth.verifyOtp({ token_hash: token, type: 'signup' });
        try { await sb.auth.signOut(); } catch {}
        history.replaceState(null, '', location.pathname + '?flow=confirm');
        if (error) {
          needResend('That confirmation link has expired or was already used. Nothing was confirmed. Send yourself a new link below.');
        } else {
          confirmed();
        }
      } else if (action === 'resend') {
        const expired = err && /expired|invalid|already/i.test(decodeURIComponent(String(err).replace(/\+/g, ' ')));
        needResend(expired
          ? 'That link has expired or was already used. Nothing was confirmed. Send yourself a new link below.'
          : 'This link did not include a confirmation token, so your email was not confirmed here. Send yourself a new link below.');
      } else if (action === 'recovery') {
        title.textContent = 'Open this link in TUITEA';
        msg.textContent = 'This link signs you in or resets your password, and it works in the TUITEA app. ' +
          'On iPhone, open the same link from the Mail app. Nothing on your account has changed.';
      }
    } catch (e) {
      needResend('That confirmation link could not be checked. Check your connection, or send yourself a new link below.');
    }
  </script>
</body>
</html>
