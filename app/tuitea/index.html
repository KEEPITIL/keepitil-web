<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUITEA</title>
<!--
  EK-012 (2026-10-26): entry page restored. Replaces the 2026-10-12 retirement redirect that sent
  every browser to /support/?product=tuitea. This page now links to the web app at /app/tuitea/app/
  and keeps the support link. Deliberately static: it does NOT load ../pwa.js, so visiting this
  page registers no service worker. (Visitors who already have /app/tuitea/sw.js registered by the
  app are served this document network-first by that worker; see sw.js.)
  Two jobs other live code depends on are kept, unchanged from the retired page:
    1. A home-screen (PWA) launch that still opens /app/tuitea/ goes straight to the web app.
    2. An invitation link (/join -> ?invite=<token>) still saves its token for the web app, and (EK-015)
       "Open TUITEA" and the PWA redirect forward it to the app as ?token=<token>.
  The manifest id stays /app/tuitea/, so this path must exist; do not delete it.
  Rollback: revert this commit (restores the support redirect).
-->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#3F7658">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
(function () {
  // EK-015: the app reads an invitation from ?token= (lib/services/invite_links.dart), so a valid
  // ?invite=<token> is forwarded to the app as ?token=<token> -- by the PWA redirect and by "Open TUITEA".
  var t = '';
  try { t = (new URLSearchParams(location.search).get('invite') || '').toLowerCase(); } catch (e) {}
  if (!/^[0-9a-f]{32}$/.test(t)) t = '';
  var appUrl = '/app/tuitea/app/' + (t ? '?token=' + t : '');
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                   window.navigator.standalone === true;
  if (standalone) { window.location.replace(t ? appUrl + location.hash : '/app/tuitea/app/' + location.search + location.hash); return; }
  try { if (t) localStorage.setItem('tuitea-pending-invite', t); } catch (e) {}
  if (t) document.addEventListener('DOMContentLoaded', function () {
    var a = document.querySelector('a.open');
    if (a) a.setAttribute('href', appUrl);
  });
})();
</script>
<style>
  :root{--bg:#FBF7EF;--fg:#20261F;--muted:#6E7566;--forest:#3F7658}
  @media (prefers-color-scheme: dark){:root{--bg:#14170F;--fg:#ECE7DA;--muted:#A9AE9F}}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font:17px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  main{max-width:28rem;padding:2rem 16px;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.4rem;letter-spacing:.14em;margin:.75rem 0 .25rem}
  p{margin:.5rem 0;color:var(--muted)}
  .open{display:inline-block;margin:1.25rem 0 .75rem;background:var(--forest);color:#fff;
        border-radius:999px;padding:.75rem 1.5rem;font-weight:600;text-decoration:none}
  .support a{color:inherit}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>TUITEA</h1>
  <p>A private family app.</p>
  <a class="open" href="/app/tuitea/app/">Open TUITEA</a>
  <p class="support">Need help? <a href="https://keepitil.com/support/?product=tuitea">TUITEA support</a></p>
</main>
</body>
</html>
