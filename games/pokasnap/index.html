<!-- COMING SOON GATE (Joe, 2026-11-11). The game is kept in this folder as index.play.html and is not deployed
     (.github/pages-exclude.txt). To bring it back: git mv index.play.html index.html and remove its exclude line. -->
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;background:#0a0a0f;color:#e8eef2;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.w{padding:28px;max-width:30rem}h1{font-size:20px;letter-spacing:.06em;margin:0 0 10px}p{color:#9fb0bb;margin:0 0 18px}a{color:#fff;font-weight:700}</style>
<div class="w"><h1>POKASNAP IS COMING SOON</h1><p>Taking you to KEEPITIL Games…</p><a href="/games/#coming-soon">Continue to KEEPITIL Games</a></div>
<script>
(function(){ var go = function(){ location.replace("/games/#coming-soon"); };
  if (!('serviceWorker' in navigator)) return go();
  // Retire this route's own worker and caches only (the Cache API is origin-wide; other games keep theirs). Saves are untouched.
  navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.filter(function(r){ return r.scope.indexOf("/games/pokasnap/") !== -1; }).map(function(r){ return r.unregister(); })); })
    .then(function(){ return window.caches ? caches.keys() : []; })
    .then(function(ks){ return Promise.all(ks.filter(function(k){ return ["pokasnap-"].some(function(p){ return k.indexOf(p) === 0; }); }).map(function(k){ return caches.delete(k); })); })
    .then(go, go);
})();
</script>
</html>
