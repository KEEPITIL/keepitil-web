@media (min-aspect-ratio:5/4) and (min-width:820px) and (min-height:541px){
  :root{--hs:clamp(1,calc(100vw / 1280px),1.35)}
  #hud{padding:12px 14px 0}#hL{width:calc(118px * var(--hs));gap:6px}.pill{height:calc(40px * var(--hs));font-size:calc(22px * var(--hs));padding:0 12px 0 8px;border-radius:11px}.pill img{width:calc(27px * var(--hs));height:calc(27px * var(--hs))}
  #hR{flex-direction:row;width:auto;gap:8px}#hC{font-size:calc(22px * var(--hs))}#hC img{width:calc(26px * var(--hs));height:calc(26px * var(--hs))}#hR .pill{padding:0 14px 0 10px}#hR .sm{font-size:calc(14px * var(--hs))}#hC{max-width:calc(380px * var(--hs));padding:0 14px}#hC .sep{margin:0 12px}
  /* desktop = the phone-landscape arrangement: one collapsible column of the six class cards on the left, POWER · UPGRADE · ATTACK
     stacked on the right, nothing across the bottom over the tank */
  #drawer{left:10px;bottom:12px}
  #drawer.away{transform:translateX(calc(-100% + 22px))}
  .cl{width:calc(150px * var(--hs));height:min(calc(58px * var(--hs)),calc((100vh - 150px) / 6))}
  #rightCol{right:14px;bottom:14px}
  .rb{width:calc(92px * var(--hs));height:calc(86px * var(--hs))}.rb img{width:calc(44px * var(--hs));height:calc(44px * var(--hs))}.rb b{font-size:calc(15px * var(--hs))}#postureBtn b{font-size:calc(16px * var(--hs))}
  #choice{top:calc(12px + 52px * var(--hs))}
}
/* phone landscape (short screens, any width): one top row (time · army · wave | gold · diamonds | settings · speed · mode),
   the class roster down the left, the battlefield in the centre, POWER · UPGRADE · ATTACK down the right.
   Same pills, cards and buttons as portrait, sized by the screen height, clear of the notch / Dynamic Island / home bar. */
@media (orientation:landscape) and (max-height:540px){
  :root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--hs:clamp(.82,min(calc(100vh / 430px),calc((100vw - var(--sl) - var(--sr)) / 690px)),1)}
  canvas#c{width:100%;height:100%}
  #hud{padding:calc(var(--st) + 6px) max(8px,var(--sr)) 0 max(8px,var(--sl));grid-template-columns:minmax(max-content,1fr) minmax(calc(150px * var(--hs)),calc(224px * var(--hs))) minmax(max-content,1fr);gap:8px}
  #hL,#hR{flex-direction:row;width:auto}#hL{justify-self:start}#hR{justify-self:end}
  #hL .pill{min-width:calc(50px * var(--hs))}
  #drawer{left:max(6px,var(--sl));bottom:calc(var(--sb) + 6px)}
  #drawer.away{transform:translateX(calc(-100% + 22px))}
  .cl{height:min(calc(52px * var(--hs)),calc((100vh - var(--st) - var(--sb) - 80px) / 6));height:min(calc(52px * var(--hs)),calc((100dvh - var(--st) - var(--sb) - 80px) / 6));min-height:34px}
  #rightCol{right:max(8px,var(--sr));bottom:calc(var(--sb) + 6px)}
  #choice{top:calc(var(--st) + 14px + 31px * var(--hs))}
  #tip{bottom:calc(var(--sb) + 20vh);padding:0 calc(max(8px,var(--sr)) + 72px * var(--hs) + 12px) 0 calc(max(6px,var(--sl)) + 136px * var(--hs) + 36px)}   /* centred in the battlefield column, clear of the roster and the controls */
  #tip .big{font-size:clamp(20px,7.5vh,32px)}
  #banner{top:28%;font-size:clamp(18px,7.5vh,34px)}
  /* menus: never under the notch or the home bar; the tall ones use the width (two columns) so their buttons stay on screen; scroll as a last resort */
  .screen{padding:max(8px,var(--st)) max(16px,var(--sr)) max(8px,var(--sb)) max(16px,var(--sl))}
  .panel{max-height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
  #pause .panel,#over .panel,#shop .panel{width:min(calc(100vw - 32px - var(--sl) - var(--sr)),720px)}
  #pause .panel,#over .panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px;align-items:center}
  #pause h2{grid-column:1 / -1}#pause .toggles{grid-column:1;grid-row:2 / span 3;margin:0}#pause .btn{grid-column:2}
  #over .sv,#over .tm,#over .pb,#over .row,#reviveBtn{grid-column:1}#over .stats{grid-column:2;grid-row:1 / span 5;margin:0}#over .tm{font-size:clamp(40px,14vh,64px);white-space:nowrap}
  .shopgrid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:calc(100vh - var(--st) - var(--sb) - 216px)}
  #shop .item .nm svg{width:28px;height:28px;vertical-align:middle}   /* the power icon stays an icon in the short landscape grid */
  #shop .item{padding:7px 9px}
}
@media (orientation:landscape) and (max-height:400px){ .shopgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }   /* shortest phones: wider cards, fewer wrapped lines */
#shop .tabs{display:flex;gap:6px;margin:8px 0}#shop .tabs button{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#fff;font-family:var(--disp);font-size:13px;padding:7px 0;cursor:pointer}#shop .tabs button.on{background:linear-gradient(#ffd23a,#f2a10c);color:#2a1a00}
#shop .item .bt{display:flex;gap:5px;margin-top:5px}#shop .item .bt button{flex:1;border-radius:8px;border:1px solid var(--line);background:#24365e;color:#fff;font-size:10px;font-weight:900;padding:4px 0;cursor:pointer}#shop .item .bt button[disabled]{opacity:.35}
.titleRec{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;font-weight:900;opacity:.9}.titleRec b{font-family:var(--disp);font-size:16px;font-weight:400;display:block}
</style>
</head>

  <button class="btn sec hidden" id="reviveBtn" style="margin-top:10px;font-size:16px">REVIVE (ONCE)</button>
